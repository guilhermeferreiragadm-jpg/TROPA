<title>Tropa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,900&text=TROPAtropa&display=swap">
<style>
/* Layout: app de celular numa coluna de até 480px sobre fundo agrupado; barra de abas de vidro flutuante com o botão Coach · Nutri ao lado; sheets arrastáveis.
   Tema claro por decisão do dono (não gosta de preto); laranja de marca só em elementos sem texto, fundo de botão com texto usa --go-fill; verde/amarelo/vermelho só para estado. */
:root{
  color-scheme:light;
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#EBEBF0; --tx:#0B0D10; --tx-2:#5A626C; --sep:rgba(60,60,67,.14);
  --go:#FF5A00; --go-fill:#CF4500; --go-press:#B53B00; --go-ink:#C23E00; --go-soft:#FFF1EC;
  --done:#13A150; --done-ink:#0F7A3E; --done-soft:#EAF7EF; --done-line:#BFE6CE;
  --caution:#E5A100; --caution-soft:#FFF7E0; --warn-ink:#8A5F00;
  --stop:#E0362B; --stop-ink:#C62A20; --stop-soft:#FDECEA;
  --neutro:#5A626C; --track:#E1E1E7; --swim-ink:#1565C0; --run:#FF5A00; --swim:#1E88E5; --bike:#E39A06; --gym:#6E56CF; --noite:#0B0D10;
  --r1:10px; --r2:14px; --r3:20px; --r4:28px;
  --sh1:0 1px 2px rgba(0,0,0,.06); --sh2:0 4px 16px rgba(0,0,0,.08); --sh3:0 12px 40px rgba(0,0,0,.18);
  --mat-fino:rgba(255,255,255,.6); --mat-reg:rgba(255,255,255,.72); --mat-grosso:rgba(255,255,255,.86); --mat-borda:rgba(255,255,255,.4);
  --f:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --f-wm:"Exo 2",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
:root[data-tema="escuro"]{color-scheme:dark;--bg:#0F1317;--surface:#181D22;--surface-2:#20262C;--tx:#F2F4F6;--tx-2:#A7B0B9;--sep:rgba(255,255,255,.12);
  --go-ink:#FF8A4C;--go-soft:#2A1A12;--done-ink:#4ADE80;--done-soft:#12261B;--done-line:#1F5A38;--warn-ink:#F0B429;--caution-soft:#2B2410;--stop-ink:#FF7A70;--stop-soft:#2D1512;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 4px 16px rgba(0,0,0,.4);--sh3:0 12px 40px rgba(0,0,0,.6);
  --mat-fino:rgba(24,29,34,.6);--mat-reg:rgba(24,29,34,.72);--mat-grosso:rgba(24,29,34,.86);--mat-borda:rgba(255,255,255,.08);
  --swim-ink:#6AB7FF;--track:#313941}
/* materiais: vidro com blur; sólido quando o usuário pede menos transparência ou o navegador não suporta */
.mat,.mat-reg{border:1px solid var(--mat-borda)}
.mat{background:var(--mat-fino);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.mat-reg{background:var(--mat-reg);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.mat,.mat-reg{background:var(--surface)}}
@media (prefers-reduced-transparency:reduce){.mat,.mat-reg{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){:root{--sep:rgba(0,0,0,.4);--tx-2:#3F464E}:root[data-tema="escuro"]{--sep:rgba(255,255,255,.4);--tx-2:#D2D8DE}.mat,.mat-reg{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%;height:100%;overflow:hidden}   /* uma tela só: o documento nunca cresce, quem rola é o .wrap, e a barra de abas fica presa na borda de baixo */
body{font-family:var(--f);font-size:1rem;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--go-fill);outline-offset:2px}
:root[data-tema="escuro"] :focus-visible{outline-color:var(--go)}
.lst>:focus-visible,.dia-sec>summary:focus-visible,.grp>:focus-visible,.rkl :focus-visible,.post :focus-visible{outline-offset:-2px}   /* dentro de contêineres com overflow:hidden o anel de fora seria cortado */
img{max-width:100%}
.wrap{max-width:480px;margin:0 auto;height:100%;position:relative;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(112px + var(--safe-b))}
#app{display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 24px;transform-origin:50% 0}
#app.full{padding-inline:0;padding-block:0;gap:0}
.wrap:has(#app.full){padding-bottom:0}   /* telas cheias não têm barra de abas: sem folga embaixo (o chat rolava 112px e escondia a primeira mensagem sob o cabeçalho) */
/* tipografia: tracking negativo nos títulos, entrelinha curta; corpo solto */
.h1{font-weight:700;font-size:2.125rem;line-height:1.1;letter-spacing:-.03em;margin:0;text-wrap:balance}.h1.xl{font-size:3.5rem}
.h2{font-weight:700;font-size:1.375rem;line-height:1.15;letter-spacing:-.02em;margin:0}
.k{font-size:.75rem;line-height:1.3;font-weight:600;letter-spacing:.01em;color:var(--tx-2)}
.s{font-size:.875rem;line-height:1.4;color:var(--tx-2);margin:0}
p{margin:0}
.n{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wm{font-family:var(--f-wm);font-style:italic;font-weight:900;font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.wm i{width:26px;height:18px;background:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%2070%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23FF9A1F%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23FF3D00%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20fill=%22url(%23g)%22%20d=%22M38%204%20Q50%202%2062%204%20L98%2066%20L78%2066%20L56%2026%20L24%2027%20Z%22/%3E%3Cpath%20fill=%22url(%23g)%22%20d=%22M52%2029%20L10%2042%20L0%2066%20L22%2066%20Q31%2064%2038%2056%20Z%22/%3E%3C/svg%3E") center/contain no-repeat;display:inline-block}
/* pressão: feedback no pointerdown, sem espera */
.btn,.chip,.seg button,.opt,.pl,.ci,.pf-link,.lst>button,.lst>a,.wrow,.mhead button,.mcal button,.lk,.thumbs button,.ck,.kudo,.proxc,.pf-chip,.back,.tlink,.sugg button,.ph-row,.macro>button,button.box,.dia-sec>summary,button.ti{transition:transform .1s ease-out,background-color .15s ease-out,box-shadow .15s ease-out}
.btn:active,.chip:active,.seg button:active,.ck:active,.kudo:active,.mhead button:active,.thumbs button:active,.lk:active,.back:active,.tlink:active,.sugg button:active,.ph-row:active,.macro>button:active,button.box:active,button.ti:active{transform:scale(.97)}
.dia-sec>summary:active{transform:scale(.985)}   /* linhas e cartões largos ficam em .985: com .97 o movimento de uma linha inteira parece exagerado (exceção registrada na spec) */
.opt:active,.pl:active,.ci:active,.pf-link:active,.lst>button:active,.lst>a:active,.mcal button:active{transform:scale(.985)}
.wrow:active,.pf-chip:active{transform:scale(.97)}
/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:0;border-radius:var(--r2);background:var(--surface-2);color:var(--tx);font-weight:600;font-size:1.0625rem;letter-spacing:-.01em;width:100%;padding:0 16px;text-decoration:none;text-align:center}
.btn.go{background:var(--go-fill);color:#fff}.btn.go:active{background:var(--go-press)}
.btn.ink{background:var(--go-soft);color:var(--go-ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--sep)}
.btn.sm{min-height:38px;font-size:.9375rem;width:auto;border-radius:999px;padding:0 14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.lk{border:0;background:none;font-weight:600;font-size:.9375rem;padding:10px;align-self:center;color:var(--go-ink)}
.back{border:0;background:none;font-weight:600;font-size:1.0625rem;padding:10px 10px 10px 0;margin-left:-4px;align-self:flex-start;display:inline-flex;gap:4px;align-items:center;color:var(--go-ink);min-height:44px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* formulário */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.lbl{font-size:.8125rem;font-weight:600;color:var(--tx-2)}
.inp{min-height:48px;border:0;border-radius:var(--r1);background:var(--surface-2);padding:10px 14px;width:100%;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .15s ease-out,background-color .15s}
.inp:focus{background:var(--surface);box-shadow:inset 0 0 0 2px var(--go);outline:none}
textarea.inp{resize:vertical;min-height:88px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 img{width:100%;height:auto;display:block;border-radius:var(--r1)}.sv{width:100%;height:auto}.inp.cd{font-size:1.5rem;letter-spacing:.18em}.inp.pct{min-height:44px;width:64px;padding:4px}
.seg{display:grid;gap:2px;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));background:var(--surface-2);border-radius:var(--r1);padding:2px}
.seg button{border:0;border-radius:8px;min-height:44px;font-weight:600;font-size:.9375rem;background:transparent;padding:4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--go-ink);box-shadow:var(--sh1),inset 0 0 0 1.5px var(--go)}
.opt{border:0;border-radius:var(--r2);padding:12px;display:flex;align-items:center;gap:12px;background:var(--surface);box-shadow:var(--sh1);width:100%;text-align:left}
.opt b{display:block;font-weight:600}.opt small{color:var(--tx-2);font-size:.8125rem;display:block}
.opt[aria-pressed="true"]{background:var(--go-soft);box-shadow:inset 0 0 0 1.5px var(--go)}
.opt .ic{width:36px;height:36px;flex:none;display:grid;place-content:center;font-weight:700;font-size:.8125rem;background:var(--surface-2);border-radius:10px}
.opt[aria-pressed="true"] .ic{background:var(--go-fill);color:#fff}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:.9375rem;line-height:1.4;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--go-fill);margin:0}
.prog{display:flex;gap:4px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--track);transition:background-color .3s}.prog i.on{background:var(--go)}
.msg{font-size:.875rem;font-weight:600;min-height:1em}
.msg.err{color:var(--stop-ink)}
.hint{background:var(--surface-2);border-radius:var(--r1);padding:12px 14px;font-size:.875rem;color:var(--tx-2)}
.hint b{color:var(--tx)}
.flag{border-radius:var(--r2);background:var(--caution-soft);padding:12px 14px;font-size:.9375rem;box-shadow:inset 3px 0 0 var(--caution)}
.flag.red{background:var(--stop-soft);box-shadow:inset 3px 0 0 var(--stop)}
.flag.ok{background:var(--done-soft);box-shadow:inset 3px 0 0 var(--done)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span,.chip{font-size:.8125rem;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface-2);border:0}
.chip[aria-pressed="true"]{background:var(--go-soft);color:var(--go-ink);box-shadow:inset 0 0 0 1.5px var(--go)}
.pill{font-size:.6875rem;font-weight:600;padding:3px 8px;border-radius:999px;color:var(--go-ink);background:var(--go-soft);display:inline-block}
.pill.ok{background:var(--done-soft);color:var(--done-ink)}.pill.wait{background:var(--caution-soft);color:var(--warn-ink)}.pill.no{background:var(--stop-soft);color:var(--stop-ink)}
.box{border-radius:var(--r2);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);box-shadow:var(--sh1)}
.box.strong{box-shadow:var(--sh2),inset 0 0 0 1.5px var(--go)}
/* área de toque mínima de 44px: tamanho visual igual, alvo invisível maior */
.btn.sm,.chip,.lk,.pf-chip{position:relative}
.btn.sm::after,.chip::after,.lk::after,.pf-chip::after{content:"";position:absolute}
.btn.sm::after{inset:-3px 0}.chip::after,.pf-chip::after{inset:-7px -2px}.lk::after{inset:-3px 0}
.lk.vb::after{inset:-12px -6px}.lk.in{padding:0}.lk.in::after{inset:-12px -8px}   /* link dentro de texto: sem padding, alvo de 44px invisível */
@media (prefers-contrast:more){.box,.opt,.ci{box-shadow:inset 0 0 0 1px var(--sep)}}
.lst>label{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--sep);padding:14px 16px;font-weight:600;min-height:50px}
.lst>label input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--go-fill);margin:0}
.lst>.cor-go{color:var(--go-ink)}.lst>.cor-ruim{color:var(--stop-ink)}
.pv8{padding-block:8px}
.mt8{margin-top:8px}.tc{text-align:center}.upper{text-transform:uppercase}.cor-go{color:var(--go-ink)}.cor-2{color:var(--tx-2)}.cor-ok{color:var(--done-ink)}.cor-warn{color:var(--warn-ink)}.cor-ruim{color:var(--stop-ink)}.w600{font-weight:600}.as0{align-self:flex-start}.ae{align-self:flex-end}.h2.lg{font-size:1.7rem}.mw0{min-width:0}.grow{flex:1;min-width:0}
/* abertura */
.open{min-height:100vh;min-height:100dvh;background:var(--noite);color:#fff;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 20px calc(34px + var(--safe-b));gap:14px;overflow:hidden}
.open .photo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,16,.1),rgba(11,13,16,.25) 40%,rgba(11,13,16,.95) 80%),repeating-linear-gradient(115deg,#2a2f36 0 2px,#23272d 2px 9px)}
.open>*{position:relative}
.open .wm{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:20px;color:#fff;font-size:1.9rem}.open .wm i{width:44px;height:31px}
.mani{font-weight:700;font-size:3rem;line-height:1.02;letter-spacing:-.04em}
.mani em{font-style:normal;color:#FF8A4C}
.open .btn{background:rgba(255,255,255,.14);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.open .btn.go{background:var(--go-fill)}
.open .s,.open .lead{color:rgba(255,255,255,.78)}.open .lead{font-size:.9375rem}.open .msg{color:#fff}
/* match */
.dark{background:var(--noite);color:#fff;min-height:100vh;min-height:100dvh;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + var(--safe-b));display:flex;flex-direction:column;gap:12px}
.dark .s,.dark .k{color:rgba(255,255,255,.7)}
.mline{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:.9375rem;opacity:.2;transition:opacity .4s}
.mline.on{opacity:1}
.mline i{font-style:normal;font-weight:700;color:var(--done)} /* exceção documentada: tela sempre escura (--noite), o verde #13A150 tem 6:1 sobre #0B0D10 nos dois temas */
.mline small{display:block;color:rgba(255,255,255,.7);font-size:.8125rem}
.mbar{height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}.mbar i{display:block;height:100%;width:0;background:var(--go);transition:width .5s cubic-bezier(.32,.72,0,1)}
.who3{display:flex;gap:6px}
.who3 span{flex:1;border-radius:999px;box-shadow:inset 0 0 0 1px var(--go);color:#FFB07A;padding:6px;font-size:.6875rem;font-weight:600;text-align:center}
/* plano */
.proj{border-radius:var(--r3);background:var(--surface);box-shadow:var(--sh2);padding:16px;display:flex;flex-direction:column;gap:2px}
.proj b{font-weight:700;font-size:2.75rem;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.phase{display:flex;height:24px;gap:3px;border-radius:8px;overflow:hidden}
.phase span{display:grid;place-content:center;font-size:.625rem;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;padding:0 4px}
.phase span.off{background:var(--surface-2);color:var(--tx-2)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk div{border-radius:var(--r1);background:var(--surface);box-shadow:var(--sh1);padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.625rem;font-weight:600;color:var(--tx-2);text-align:center;min-width:0}
.wk div b{font-size:.6875rem;letter-spacing:-.02em;color:var(--tx);line-height:1.1;word-break:break-word}
.wk div.r{background:var(--surface-2)}
.bars{display:flex;align-items:flex-end;gap:3px;height:80px;border-bottom:1px solid var(--sep)}
.bars i{flex:1;background:var(--go);border-radius:4px 4px 0 0;display:block;min-height:3px}
.bars i.dl{background:var(--tx-2);opacity:.4}.bars i.now{background:var(--go-fill);opacity:1}
.pledge{font-weight:700;font-size:1.5rem;line-height:1.15;letter-spacing:-.02em}
.pledge em{font-style:normal;color:var(--go-ink)}
.sig{border-radius:var(--r2);height:110px;background:var(--surface-2);color:var(--tx);touch-action:none;display:block;width:100%}
/* assinatura */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{border:0;border-radius:var(--r2);padding:16px 12px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface);box-shadow:var(--sh1);text-align:left;position:relative}
.pl[aria-pressed="true"]{background:var(--go-soft);box-shadow:inset 0 0 0 1.5px var(--go)}
.pl b{font-weight:700;font-size:1.875rem;line-height:1.05;letter-spacing:-.03em}
.pl small{font-size:.8125rem;color:var(--tx-2)}
.pl .tag{position:absolute;top:-9px;right:10px;background:var(--go-fill);color:#fff;font-size:.6875rem;font-weight:600;padding:2px 8px;border-radius:999px}
.cupom{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.875rem;background:var(--done-soft);border-radius:var(--r1);padding:10px 12px;color:var(--done-ink);font-weight:600}
.cupom.go{background:var(--go-soft);color:var(--go-ink)}
.ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9375rem}
.ul li::before{content:"✓  ";color:var(--done-ink);font-weight:700}
.mic{width:64px;height:64px;border-radius:50%;background:var(--go);display:grid;place-content:center;box-shadow:0 0 0 10px var(--go-soft)}.mic i{width:14px;height:24px;border-radius:7px;background:#fff;display:block;position:relative;top:-3px}.mic i::after{content:"";position:absolute;left:-6px;right:-6px;top:15px;height:14px;border:3px solid #fff;border-top:0;border-radius:0 0 12px 12px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--sep)}.qrow>span{font-size:.875rem;min-width:0}.qrow>div{width:118px;flex:none}
/* app: topo */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.me{width:40px;height:40px;border-radius:50%;background:var(--go-fill);color:#fff;display:grid;place-content:center;font-size:.8125rem;font-weight:600;border:0;flex:none;padding:0;box-shadow:var(--sh1);position:relative}
.me::after{content:"";position:absolute;inset:-2px}
.me img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.acts{display:flex;gap:12px;flex:none}.sino{background:var(--surface-2);color:var(--tx);box-shadow:none}.sino svg{width:20px;height:20px}
.sino b{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--go-fill);color:#fff;font-size:.6875rem;line-height:18px;text-align:center}.sino b[hidden]{display:none}.modo{margin-top:12px}
.fire{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
.fire i{width:12px;height:16px;background:var(--go);clip-path:polygon(50% 0,100% 60%,80% 100%,20% 100%,0 60%);display:inline-block}
.fire.off i{background:var(--sep);filter:brightness(.85)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh1)}
.stats3>div{padding:12px;border-right:1px solid var(--sep);min-width:0}
.stats3>div:last-child{border-right:0}
.stats3 b{display:block;font-weight:700;font-size:1.5rem;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

const TPL = {
  "5k":     {nome:"5 km", pico:7, minSem:6, mods:["run"]},
  "10k":    {nome:"10 km", pico:12, minSem:8, mods:["run"]},

  tri:      {nome:"Triathlon sprint/olímpico", pico:10, minSem:8, mods:["run","swim","bike"]},
  "703":    {nome:"Meio Ironman 70.3", pico:18, minSem:20, mods:["run","swim","bike"]},
  hyrox:    {nome:"Hyrox", pico:10, minSem:8, mods:["run","hyrox"]},

function nivel(p){ const r = +p.corridasSem||0, km = +p.kmSemana||0; if (TPL[p.objetivo] && TPL[p.objetivo].forca){ const m = +p.academiaMeses||0; return m<6?"iniciante":m<24?"intermediario":"avancado"; } if (r<=1 || km<8) return "iniciante"; if (km<20) return "base"; if (km<35) return "intermediario"; return "avancado"; }
const floor2 = x => Math.floor(x*2)/2;
function baseLongao(p){ const maior = +p.maiorLongao||0, km = +p.kmSemana||0; const plaus = Math.max(3, km*0.7); return floor2(Math.max(3, Math.min(maior||3, plaus))); }
function gerarPlano(p){
  const t = TPL[p.objetivo]; if (!t) return null;
  const prova = parseD(p.dataProva);
  const start = addDays(today, -dow(today));
  let nSem = (prova && !t.geral) ? Math.floor((prova - start)/DAY/7)+1 : 12;
  nSem = Math.max(4, Math.min(52, nSem));
  const semProva = !prova || !!t.geral;
  const lv = nivel(p);
  const dias = Math.max(3, Math.min(6, +p.diasSem||4));
  const maior = baseLongao(p);
  const semanas = [];
  let longao = maior;
  const taper = semProva ? 0 : 2;
  for (let w=1; w<=nSem; w++){
    const deload = w%4===0 && w < nSem-taper;
    const isTaper = taper>0 && w > nSem - taper;
    let lg;
    if (deload) lg = floor2(longao*0.7);
    else if (isTaper) lg = Math.min(longao, floor2(Math.max(longao, 3)*(w===nSem?0.4:0.65)));
    else { lg = w<=2 ? maior : Math.min(t.pico, Math.max(floor2(longao*1.1), longao+0.5)); longao = lg; }
    const intens = !(lv==="iniciante" && w<=3) && !deload && (semProva || w<nSem) && !(t.geral && lv==="iniciante");
    const sem = {w, deload, taper:isTaper, dias:[]};
    const d = [[],[],[],[],[],[],[]];
    const tri = t.mods.includes("swim");
    if (t.forca){
      d[0].push({k:"gym", t:"Força A · inferiores", min:50, ef:"RIR 2", passos:["Agachamento 4×8","Terra romeno 3×10","Afundo 3×10","Panturrilha 4×12"]});
      d[1].push({k:"gym", t:"Força B · superiores", min:50, ef:"RIR 2", passos:["Supino 4×8","Remada curvada 4×8","Desenvolvimento 3×10","Puxada frente 3×10","Rosca direta 3×12"]});
      d[3].push({k:"gym", t:"Força C · corpo todo", min:45, ef:"RIR 2", passos:["Levantamento terra 3×6","Supino inclinado 3×10","Búlgaro 3×8","Prancha 3×40 s"]});
      if (dias>=5) d[4].push({k:"gym", t:"Força D · ombro e braço", min:40, ef:"RIR 2", passos:["Elevação lateral 4×12","Barra fixa 4×8","Rosca martelo 3×12","Tríceps corda 3×12"]});
      d[5].push({k:"run", t:"Cardio leve", min:30, ef:"3/10", passos:["30 min de corrida leve, bike ou caminhada rápida"]});
      sem.dias = d.map((x,i)=>({dia:DIAS[i], treinos:x})); sem.longao = Math.min(lg, 5); semanas.push(sem); continue;
    }
    if (t.mods.includes("hyrox") && !deload) d[3].push({k:"gym", t:"Hyrox · estações", min:50, ef:"6–7/10", passos:["Wall ball 4×15","Remada no remo 4×250 s","Afundo 4×12","Burpee 4×10"]});
    d[6].push({k:"run", t: t.geral ? "Corrida longa leve" : "Longão", km:lg, z:"fácil", ef:"3–4/10", passos:["10 min trotando bem leve","Correr "+lg+" km em ritmo de conversa (esforço 3–4/10)","5 min caminhando e alongar panturrilha"]});
    if (intens) d[1].push({k:"run", t:"Intervalado", min:45, z:"forte", ef:"7–8/10", passos:["15 min de trote + 4 acelerações de 20 s",(w%2?"6×400 m forte (esforço 8/10), 90 s trotando entre eles":"4×1 km firme (esforço 7/10), 2 min trotando entre eles"),"10 min de trote leve"]});
    else d[1].push({k:"run", t:"Corrida leve", min:30, z:"fácil", ef:"3/10", passos:["30 min em ritmo de conversa","Se sobrar perna: 4 acelerações de 15 s soltas"]});
    if (dias>=4) d[3 + (tri?1:0)].push({k:"run", t:"Regenerativo", min:30, z:"muito fácil", ef:"2–3/10", passos:["30 min bem leve, dá para falar frases inteiras"]});
    d[0].push({k:"gym", t:"Força para corredor", min:40, ef:"RIR 2–3", passos:["Agachamento 3×10","Terra romeno 3×10","Afundo 3×8","Panturrilha 3×15","Prancha 3×30 s"]});
    if (dias>=5) d[3].push({k:"gym", t:"Força + core", min:30, ef:"RIR 3", passos:["Step-up 3×10","Ponte de glúteo 3×12","Prancha lateral 3×30 s"]});
    if (tri){
      d[2].push({k:"swim", t:"Natação técnica", min:40, m:1300, ef:"4–5/10", passos:["Aquecimento · 200 m solto (crawl e costas alternando)","Educativos · 8×50 m: 1 braço, toque no ombro, polo aquático, respiração a cada 3 (15 s de pausa)","Principal · 6×100 m firme, esforço 6/10, 20 s de pausa","Solto · 100 m bem leve"]});
      d[5].push({k:"bike", t: w>=6 && !deload ? "Bike + corrida curta" : "Bike leve", min: Math.min(150, 50 + w*5), ef:"3–4/10", passos:["Pedal em ritmo de conversa"].concat(w>=6&&!deload?["Logo depois: 10 min de corrida leve (transição)"]:[])});
      if (dias>=5) d[4].push({k:"swim", t:"Natação contínua", min:35, m:1000, ef:"4/10", passos:["Aquecimento · 200 m solto","Principal · 600 m contínuos, esforço 4/10, respiração a cada 3 braçadas","Solto · 200 m alternando crawl e costas"]});
    } else if (dias>=5){
      d[4].push({k:"run", t:"Corrida leve + educativos", min:35, ef:"3/10", passos:["30 min leve","5 min de educativos (skipping, anfersen)"]});
    }
    sem.dias = d.map((x,i)=>({dia:DIAS[i], treinos:x}));
    sem.longao = lg;
    semanas.push(sem);
  }
  return {versao:2, objetivo:p.objetivo, nome:t.nome, nivel:lv, inicio:key(start), semProva, semanas, geradoEm:new Date().toISOString()};
}
function validar(plano, p){
  const v = []; const maior = baseLongao(p); let prev = maior;
  plano.semanas.forEach(s=>{
    if (s.longao > Math.max(prev*1.1, prev+0.5) + 0.01 && !s.taper) v.push("S"+s.w+": longão sobe mais de 10%");
    if (s.w<=2 && s.longao > Math.max(maior,3) + 0.01) v.push("S"+s.w+": acima do que você já faz");
    const duros = s.dias.filter(d=>d.treinos.some(t=>/forte/.test(t.z||""))).length;
    if (duros>2) v.push("S"+s.w+": mais de 2 dias duros");
    if (!s.deload && !s.taper) prev = s.longao;
  });
  return v;
}
const NOMEF = {F0:"recuperação",F1:"base",F2:"festas",F3:"meia",F4:"transição",F5:"base tri",F6:"construção",F7:"específico",F8:"polimento"};
/* cores das fases: texto branco por cima, mínimo 4,5:1 nos dois temas (tests/contraste.test.js) */
const CORF = {F0:"#667080",F1:"#46525D",F2:"#667080",F3:"var(--go-fill)",F4:"#667080",F5:"#2E5E8E",F6:"#2E5E8E",F7:"var(--go-fill)",F8:"#0F7A3E"};
function fasesDe(pl){
  if (pl.fases){ const out = []; pl.semanas.forEach(s=>{ const l = out[out.length-1]; if (l && l[3]===s.fase) l[1]++; else out.push([NOMEF[s.fase]||s.fase, 1, CORF[s.fase]||"#46525D", s.fase]); }); return out; }
  const n = pl.semanas.length; if (pl.semProva) return [["base",Math.ceil(n/3),"#46525D"],["construção",Math.ceil(n/3),"#2E5E8E"],["específico",n-2*Math.ceil(n/3),"var(--go-fill)"]].filter(x=>x[1]>0);
  const pol = 2, esp = Math.max(1, Math.round((n-pol)*0.3)), con = Math.max(1, Math.round((n-pol)*0.35)), bas = Math.max(1, n-pol-esp-con);
  return [["base",bas,"#46525D"],["construção",con,"#2E5E8E"],["específico",esp,"var(--go-fill)"],["polimento",pol,"#0F7A3E"]];
}
function faseDaSemana(pl, w){ if (pl.fases && pl.semanas[w-1]) return NOMEF[pl.semanas[w-1].fase] || ""; let acc = 0; for (const f of fasesDe(pl)){ acc += f[1]; if (w<=acc) return f[0]; } return "polimento"; }

/* O banco entrega documentos congelados (só leitura). Este invólucro devolve sempre uma cópia, para o app poder alterar e salvar. */
const copia = v => v==null ? v : JSON.parse(JSON.stringify(v));
function wrapSnap(s){ return s ? {id:s.id, exists:s.exists, metadata:s.metadata, data:()=>copia(s.data())} : s; }
function wrapQuery(q){ return {
  where:(...a)=>wrapQuery(q.where(...a)), orderBy:(...a)=>wrapQuery(q.orderBy(...a)), limit:(...a)=>wrapQuery(q.limit(...a)),
  get:async()=>{ const r = await q.get(); return {docs:r.docs.map(wrapSnap), size:r.size, empty:r.empty}; },
  onSnapshot:(f, e)=>q.onSnapshot(r=>f({docs:r.docs.map(wrapSnap), size:r.size, empty:r.empty}), e),
  doc:(id)=>wrapDoc(q.doc(id)), add:(v)=>q.add(v)
}; }
function wrapDoc(d){ return { id:d.id, path:d.path, get:async()=>wrapSnap(await d.get()), set:v=>d.set(v), update:v=>d.update(v), delete:()=>d.delete(), onSnapshot:(f, e)=>d.onSnapshot(s=>f(wrapSnap(s)), e), collection:p=>wrapQuery(d.collection(p)) }; }
function wrapDb(real){ return real ? {collection:p=>wrapQuery(real.collection(p)), doc:p=>wrapDoc(real.doc(p))} : real; }
function hybrid(real){ const loc = localStore(); const isLocal = p => /^(data\/users|revisao|resumo|pedidos|acessos)/.test(p); return {collection: p => isLocal(p) ? loc.collection(p) : real.collection(p)}; }

}

function podarFotos(){
  const nFp0 = Object.keys(LOG).filter(k=>/^fp_/.test(k)).length;
  const lim = key(addDays(today,-10));
  Object.keys(LOG).forEach(k=>{
    if (k.startsWith("ft_") && k.slice(3,13) < lim) delete LOG[k];
    if (k.startsWith("ref_") && k.slice(4,14) < lim && Array.isArray(LOG[k]) && LOG[k].some(r=>r.thumb)) LOG[k] = LOG[k].map(r=>{ const c = Object.assign({}, r); delete c.thumb; return c; });
  });
  comprasObsoletas(Object.keys(LOG), key(today)).forEach(k=>{ delete LOG[k]; });
  let tam = 0; try{ tam = JSON.stringify(LOG).length; }catch(e){}
  if (tam > 200000){
    const cps = Object.keys(LOG).filter(k=>/^compras_\d{4}-\d{2}-\d{2}$/.test(k)).sort();   // a poda de emergência larga primeiro as listas de compras, menos a mais recente
    cps.slice(0, -1).forEach(k=>{ delete LOG[k]; });
    try{ tam = JSON.stringify(LOG).length; }catch(e){}
  }
  if (tam > 200000){ const alvoT = 180000 + Object.keys(LOG).filter(k=>/^fp_/.test(k)).reduce((a,k)=>a+JSON.stringify(LOG[k]).length, 0); Object.keys(LOG).filter(k=>/^(ft_|ref_)/.test(k)).sort().forEach(k=>{ if (JSON.stringify(LOG).length < alvoT) return; if (k.startsWith("ft_")) delete LOG[k]; else LOG[k] = LOG[k].map(r=>{ const c = Object.assign({}, r); delete c.thumb; return c; }); }); }
  try{ tam = JSON.stringify(LOG).length; }catch(e){}
  if (tam > 220000){ const fp = Object.keys(LOG).filter(k=>/^fp_\d{4}-\d{2}-\d{2}$/.test(k)).sort(); fp.slice(0, -2).forEach(k=>{ delete LOG[k]; }); }
  try{ tam = JSON.stringify(LOG).length; }catch(e){}
  if (tam > 240000){ Object.keys(LOG).filter(k=>/^fp_\d{4}-\d{2}-\d{2}$/.test(k)).forEach(k=>{ delete LOG[k]; }); }
  if (Object.keys(LOG).filter(k=>/^fp_/.test(k)).length < nFp0) setTimeout(()=>toast("Para liberar espaço, algumas fotos de progresso antigas foram apagadas."), 0);
}

// Pausa, volta gradual e teto de carga: só dados, sem DOM, LOG ou P. Testado em tests/pure.test.js
const PRIO_CHAVE = 3, PRIO_RESTO = 1;
function diasPausa(ini, fim){ return Math.max(1, Math.round((parseD(fim) - parseD(ini))/DAY) + 1); }
function semanasDeslocadas(dias){ return dias <= 7 ? 0 : Math.ceil(dias/7); }
function rampaRetorno(dias){
  if (dias <= 3) return {fatores:[], refazer:false};
  if (dias <= 7) return {fatores:[0.8], refazer:false};
  if (dias <= 14) return {fatores:[0.6,0.8], refazer:false};
  return {fatores:[0.5,0.65,0.8], refazer: dias > 28};
}
function pausaCobre(pausas, k){ return pausas.some(p=>p.inicio <= k && (!p.fim || k <= p.fim)); }
function deslocamentoEm(pausas, k){ return pausas.reduce((s,p)=>s + (p.fim && k > p.fim ? (p.desl||0) : 0), 0); }
function fatorRetornoEm(pausas, k){
  const ps = pausas.filter(p=>p.fim && p.fim < k && (p.fatores||[]).length).sort((a,b)=>a.fim < b.fim ? 1 : -1);
  if (!ps.length) return 1;
  const sem = Math.floor((parseD(k) - addDays(parseD(ps[0].fim), 1))/DAY/7);
  const f = ps[0].fatores[sem];
  return f == null ? 1 : f;
}
function semanaEm(plano, pausas, k){
  const ini = addDays(parseD(plano.inicio), 7*deslocamentoEm(pausas, k));
  const w = Math.floor((parseD(k) - ini)/DAY/7) + 1;
  return {w, ini, sem: plano.semanas[w-1] || null};
}
function semanasAtrasoProva(plano, pausas){ return plano.semProva ? 0 : pausas.reduce((s,p)=>s + (p.desl||0), 0); }
function escalarTreino(t, f){
  if (!(f < 1)) return t;
  const c = Object.assign({}, t), msg = "Volta gradual: ~"+Math.round(f*100)+"% do volume de antes da pausa";
  if (t.km) c.km = Math.max(1, Math.round(t.km*f*2)/2);
  if (t.min) c.min = Math.max(10, Math.round(t.min*f));
  if (/forte/.test(t.z||"")){ c.z = "fácil"; c.ef = "até 5/10"; }
  if (t.k === "gym") c.passos = [msg+" (menos séries, carga leve)"].concat(t.passos||[]);
  else c.passos = [msg+": "+(c.km ? String(c.km).replace(".",",")+" km" : c.min+" min")+", em esforço de conversa"];
  return c;
}
const minutosPlan = t => t.min ? +t.min : (t.km ? Math.round(t.km*7) : 0);
function prioridadeTreino(t){ return /Longão|longa/i.test(t.t||"") || /forte/.test(t.z||"") ? PRIO_CHAVE : PRIO_RESTO; }
function calcularTeto(feitas, perfilMin, limiteDoc){
  const com = feitas.filter(m=>m>0);
  const base = com.length ? com.reduce((a,b)=>a+b,0)/com.length : (perfilMin||0);
  if (!(base > 0)) return limiteDoc > 0 ? {base:0, teto:Math.round(limiteDoc)} : null;
  let teto = Math.max(base*1.1, base+15);
  if (limiteDoc > 0) teto = Math.min(teto, limiteDoc);
  return {base:Math.round(base), teto:Math.round(teto)};
}
function reduzirParaTeto(dias, teto){
  let total = dias.reduce((s,d)=>s+d.min, 0); const cortes = [];
  if (total <= teto) return {cortes, total, excedeu:false};
  const cand = dias.filter(d=>!d.fixo && d.min > 0).sort((a,b)=>a.prio-b.prio || b.min-a.min);
  for (const d of cand){
    if (total <= teto) break;
    const novo = Math.round(d.min*0.6);
    cortes.push({id:d.id, de:d.min, para:novo}); total -= d.min - novo;
  }
  return {cortes, total, excedeu: total > teto};
}
function motivoGenerico(t, c){

function voltarPorGesto(){
  const app = $("app"), borda = document.createElement("div"); borda.id = "borda"; borda.setAttribute("aria-hidden","true"); document.body.appendChild(borda);

  const tel = () => { borda.hidden = !botao(); };
  new MutationObserver(tel).observe(app, {childList:true}); tel();
  borda.addEventListener("pointerdown", e => {
    if (e.button > 0 || !botao() || ativo) return;
    ativo = true; pid = e.pointerId; decidido = false; x0 = e.clientX; y0 = e.clientY; am = [{t:e.timeStamp, x:e.clientX}];

    }

      if (e && e.type==="pointerup" && r && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) b.click();
      return;
    }
    if (e && e.type==="pointerup") am.push({t:e.timeStamp, x:e.clientX});   // dedo parado antes de soltar: velocidade zero
    const m = Mov.estado(app), L = app.parentElement.clientWidth || 390, v = velocidade(am);
    if (projetar(m.x, v) > L*0.5 || v > 800){
      const sai = Mov.reduz() ? (m.x = 0, Mov.aplicar(app), Mov.para(app, {o:0})) : Mov.para(app, {x:L, o:0}, "suave", {x:v});

}

/* ===================== SAÚDE ===================== */
function flagsDe(p){
  const red = PARQ.filter(([k])=>p[k]==="sim" && k!=="q6").map(([k,t])=>t);
  const amarelo = [];
  if (p.q6==="sim") amarelo.push("Problema de osso/articulação/músculo no último ano");
  if (p.morte==="sim") red.push("Morte súbita cardíaca na família antes dos 50");
  if (p.ta==="sim") red.push("Histórico de transtorno alimentar");
  if (p.fratura==="sim") amarelo.push("Já teve fratura por estresse");
  if (p.ciclo==="sim") red.push("Ciclo ausente/irregular há 3+ meses (sinal de REDs)");
  if (p.fumo==="sim") amarelo.push("Fuma ou usa vape");
  if (p.prazoCurto) amarelo.push("Prazo até a prova abaixo do mínimo seguro");
  const dor = /(\d+)\s*\/?\s*10/.exec(String(p.dorAgora||"")); if (dor && +dor[1]>=6) red.push("Dor atual "+dor[1]+"/10");
  else if (p.dorAgora && !/nenhum|não|nao|0\/10/i.test(p.dorAgora)) amarelo.push("Dor/lesão: "+String(p.dorAgora).slice(0,60));
  if ((+p.sono||7) <= 5) amarelo.push("Dorme 5 h ou menos");
  if (p.fisio && p.fisio.lesao) amarelo.push("Lesão em acompanhamento com fisioterapeuta");
  return {red, amarelo};
}
