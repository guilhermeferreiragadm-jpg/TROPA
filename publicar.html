function graficoPeso(lista){
  const pts = lista.filter(x=>x.d >= key(addDays(today,-90)));
  if (pts.length < 2) return "";
  const dia = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10))/864e5, t0 = dia(pts[0].d), t1 = Math.max(dia(pts[pts.length-1].d), t0+1);
  const kgs = pts.map(x=>x.kg), mn = Math.min(...kgs) - 0.5, mx = Math.max(...kgs) + 0.5;
  const X = d => 10 + 300*(dia(d)-t0)/(t1-t0), Y = kg => 10 + 80*(1-(kg-mn)/(mx-mn));
  const d = pts.map((x,i)=>(i?"L":"M")+X(x.d).toFixed(1)+" "+Y(x.kg).toFixed(1)).join(" ");
  return '<svg viewBox="0 0 320 100" role="img" aria-label="Peso nos últimos 90 dias" class="sv"><path d="'+d+'" fill="none" stroke="var(--tx)" stroke-width="2"/>'+pts.map(x=>'<circle cx="'+X(x.d).toFixed(1)+'" cy="'+Y(x.kg).toFixed(1)+'" r="3" fill="var(--go)"/>').join("")+'</svg><span class="s">'+num(Math.min(...kgs),1)+' a '+num(Math.max(...kgs),1)+' kg nos últimos 90 dias</span>';
}

/* ===================== PAINEL DO DONO ===================== */
const REV = {}, APR = {}, RES = {}, PED = {}, ACS = {}, PROFN = {}, ACS_IND = {};
let painelAba = "pessoas";
function telaPainel(){
  if (!isOwner){ ir("hoje"); return; }
  const ids = Object.keys(REV).sort((a,b)=>String(REV[b].at).localeCompare(String(REV[a].at)));
  const pend = Object.keys(PED).filter(id=>!ACS[id] || !ACS[id].status);
  const abas = [["pessoas","Pessoas"],["afiliados","Afiliados"],["precos","Preços"],["config","Convite"]];
  let h = '<button type="button" class="back" data-go="perfil">← Perfil</button><span class="k">só você vê</span><h1 class="h1">Painel do dono</h1>'+
    '<div class="seg" style="--c:4" id="pa">'+abas.map(([v,l])=>'<button type="button" data-v="'+v+'" aria-pressed="'+(painelAba===v)+'">'+l+'</button>').join("")+'</div>';

  const mrr = pagantes.reduce((a,id)=>{ const s = REV[id].assinatura; return a + (s.plano==="anual" ? (s.valor||PRECOS.anual)/12 : (s.valor||PRECOS.mensal)); }, 0);
  if (painelAba==="pessoas"){
    h += '<div class="kpi4"><div><b>'+ids.length+'</b><span>cadastrados</span></div><div><b>'+pagantes.length+'</b><span>escolheram plano</span><em>'+reais(mrr)+'/mês se pagassem</em></div></div>'+
      '<span class="k">pedidos de acesso</span>'+(pend.length ? pend.map(id=>'<div class="box"><b data-pn="'+esc(id)+'">'+esc(PROFN[id]||"Alguém novo")+'</b><span class="s">'+esc([PED[id].quem?"convidado por "+PED[id].quem:"", PED[id].obj||""].filter(Boolean).join(" · "))+'</span><div class="grid2"><button class="btn go sm" type="button" data-aceita="'+esc(id)+'">Aceitar</button><button class="btn sm" type="button" data-recusa="'+esc(id)+'">Recusar</button></div></div>').join("") : '<p class="s">Nenhum pedido novo.</p>')+
      '<span class="k">planos</span>'+(ids.length ? ids.map(id=>{ const r = REV[id], ap = APR[id], rs = RES[id], red = r.flags&&r.flags.red&&r.flags.red.length;

          '<span class="s">'+esc((TPL[r.objetivo]?TPL[r.objetivo].nome:r.objetivo)+(r.dataProva?" em "+r.dataProva:"")+" · "+r.corridasSem+" corridas/sem, "+r.kmSemana+" km · academia "+(r.academiaMeses||0)+" meses · "+r.diasSem+" dias · origem: "+(r.indicadoPor?(r.indicadoPor==="dono"?"seu código":"afiliado "+r.indicadoPor):"pedido de acesso")+" · plano: "+((r.assinatura&&r.assinatura.plano)||"—"))+'</span>'+
          (red?'<div class="flag red">Bloqueante: '+esc(r.flags.red.join("; "))+'. Aprove só com liberação médica por escrito.</div>':'')+(r.flags&&r.flags.amarelo&&r.flags.amarelo.length?'<div class="flag">'+esc(r.flags.amarelo.join("; "))+'</div>':'')+
          (rs?'<span class="s">7 dias: '+rs.checkins7+' check-ins · '+(rs.aderencia7==null?"—":rs.aderencia7+"%")+' feito · dor máx '+rs.dorMax7+'/10 · nível '+(rs.nivel||1)+' · foguinho '+(rs.foguinho||0)+(rs.alerta?' · ⚠ alerta de sintoma':'')+'</span>':'')+
          '<div class="grid2"><button class="btn sm ink" type="button" data-apr="'+esc(id)+'"'+(red?' data-red="1"':'')+'>Aprovar</button><button class="btn sm" type="button" data-aj="'+esc(id)+'">Pedir ajuste</button></div><div class="row" data-ajbox="'+esc(id)+'" hidden><input class="inp" placeholder="O que ajustar? (a pessoa vê)" data-ajt="'+esc(id)+'"><button class="btn sm go" type="button" data-ajok="'+esc(id)+'">Enviar</button></div></div>'; }).join("") : '<p class="s">Ninguém se cadastrou ainda. Mande o convite.</p>')+
      '<p class="s">Amigos que entram pelo link aberto guardam os dados no próprio celular: só aparecem aqui os que entram com acesso de colaborador. No app oficial, todos aparecem.</p>';
  } else if (painelAba==="afiliados"){
    const tags = {}; Object.keys(REV).forEach(id=>{ const t = REV[id].indicadoPor || "—"; (tags[t] = tags[t] || []).push(id); });
    const linhas = Object.keys(tags).filter(t=>t!=="—").map(t=>{ const pct = (AFIL[t]&&AFIL[t].pct!=null) ? AFIL[t].pct : (t==="dono"?0:PRECOS.comissao||25); const ps = tags[t].filter(id=>REV[id].assinatura && ["anual","mensal"].includes(REV[id].assinatura.plano)); const rec = ps.reduce((a,id)=>{ const s = REV[id].assinatura; return a + (s.plano==="anual"?(s.valor||PRECOS.anual)/12:(s.valor||PRECOS.mensal)); },0); return [t, tags[t].length, ps.length, pct, rec*pct/100, (AFIL[t]&&AFIL[t].nome)||""]; });
    h += '<p class="s">Cada amigo tem um código no formato '+esc(CODIGO||"CODIGO")+'-XXXX. A origem de cada cadastro aparece aqui. Comissão padrão: '+(PRECOS.comissao||25)+'%.</p>'+

      (linhas.length ? linhas.map(l=>'<tr><td><b>'+esc(l[0]==="dono"?"Você (código base)":l[0])+'</b>'+(l[5]?'<br><span class="s">'+esc(l[5])+'</span>':'')+'</td><td class="n">'+l[1]+'</td><td class="n">'+l[2]+'</td><td>'+(l[0]==="dono"?'—':'<input class="inp n pct" type="number" min="0" max="100" value="'+l[3]+'" data-pct="'+esc(l[0])+'" aria-label="Comissão de '+esc(l[0])+'">%')+'</td><td class="n">'+reais(l[4])+'</td></tr>').join("") : '<tr><td colspan="5" class="s">Nenhum cadastro por código ainda.</td></tr>')+'</tbody></table></div>'+
      '<div class="box"><b>Dar comissão especial</b><div class="grid2"><input class="inp upper" id="af-t" placeholder="Código (XXXX)"><input class="inp" id="af-p" type="number" placeholder="% ex.: 50"></div><input class="inp" id="af-n" placeholder="Nome (ex.: padrasto)"><button type="button" class="btn ink" id="af-ok">Salvar comissão</button></div>'+
      '<p class="s">Regra sugerida: pagar depois dos 7 dias de arrependimento e da 1ª renovação, só sobre o valor líquido, 1 nível só.</p>';
  } else if (painelAba==="precos"){
    h += '<div class="box"><b>Preços</b><div class="grid2"><div class="fld"><label for="pr-m">Mensal (R$)</label><input class="inp" id="pr-m" type="number" step="0.1" value="'+PRECOS.mensal+'"></div><div class="fld"><label for="pr-a">Anual (R$)</label><input class="inp" id="pr-a" type="number" step="1" value="'+PRECOS.anual+'"></div><div class="fld"><label for="pr-t">Dias grátis</label><input class="inp" id="pr-t" type="number" value="'+PRECOS.teste+'"></div><div class="fld"><label for="pr-k">Comissão padrão (%)</label><input class="inp" id="pr-k" type="number" value="'+(PRECOS.comissao||25)+'"></div></div><p class="s">Anual sai '+reais(PRECOS.anual/12)+'/mês: economia de '+reais(PRECOS.mensal*12-PRECOS.anual)+' no ano.</p><button type="button" class="btn ink" id="pr-ok">Salvar preços</button></div>'+
      '<div class="box"><b>Cupons</b>'+(CUPONS.length?CUPONS.map((c,i)=>'<div class="between"><span><b class="n">'+esc(c.codigo)+'</b> · −'+c.pct+'%'+(c.ate?' · até '+esc(c.ate):'')+'</span><button type="button" class="btn sm ghost" data-cdel="'+i+'">Remover</button></div>').join(""):'<p class="s">Nenhum cupom.</p>')+
      '<div class="grid2"><input class="inp upper" id="cu-c" placeholder="CÓDIGO"><input class="inp" id="cu-p" type="number" placeholder="% de desconto"></div><input class="inp" id="cu-a" type="date" aria-label="Válido até"><button type="button" class="btn ink" id="cu-ok">Criar cupom</button></div>';
  } else {
    h += '<div class="box"><b>Código de convite</b><p class="s">Quem abre pelo link aberto precisa deste código. Se trocar, quem ainda não entrou precisa do novo.</p><div class="between"><span class="code">'+esc(CODIGO||"—")+'</span><button class="btn sm" type="button" id="cod">'+(CODIGO?"Gerar outro":"Gerar")+'</button></div></div>'+
      '<div class="box"><b>Convidar</b><p class="s">1) Copie o convite e mande no WhatsApp. 2) Uma vez só: no Claude, em Compartilhar, libere "qualquer pessoa com o link".</p><button class="btn ink" type="button" id="inv">Copiar convite</button></div>'+
      '<div class="box"><b>Seu WhatsApp (aparece no feedback dos amigos)</b><input class="inp" id="wa" placeholder="https://wa.me/5511999999999" value="'+esc(CONTATO)+'"><button class="btn" type="button" id="waok">Salvar contato</button></div>'+
      '<div class="box"><b>Ver como um amigo vê</b><p class="s">Abre o app do zero, como um amigo novo. Nada é salvo.</p><button class="btn go" type="button" id="demo">Começar a demonstração</button></div>';
  }
  const app = tela(h, {});
  bindGo(app);
  $("pa").addEventListener("click", e=>{ const b = e.target.closest("button[data-v]"); if (b){ painelAba = b.dataset.v; telaPainel(); } });
  const W = (doc, v) => realDb.collection("config").doc(doc).set(v);
  app.querySelectorAll("[data-aceita]").forEach(b=>b.addEventListener("click", ()=>realDb.collection("acessos").doc(b.dataset.aceita).set({status:"aceito", indicadoPor:"pedido", at:new Date().toISOString()}).then(()=>toast("Aceito.")).catch(()=>toast("Não consegui salvar."))));
  app.querySelectorAll("[data-recusa]").forEach(b=>b.addEventListener("click", ()=>{ if (b.dataset.armed!=="1"){ b.dataset.armed = "1"; b.textContent = "Confirmar recusa"; return; } realDb.collection("acessos").doc(b.dataset.recusa).set({status:"recusado", at:new Date().toISOString()}).catch(()=>{}); }));
  app.querySelectorAll("[data-apr]").forEach(b=>b.addEventListener("click", ()=>{ if (b.dataset.red && b.dataset.armed!=="1"){ b.dataset.armed = "1"; b.textContent = "Recebi a liberação médica"; return; } realDb.collection("aprovados").doc(b.dataset.apr).set({status:"aprovado", at:new Date().toISOString()}).then(()=>toast("Aprovado.")).catch(()=>toast("Não consegui aprovar.")); }));
  app.querySelectorAll("[data-aj]").forEach(b=>b.addEventListener("click", ()=>{ const bx = app.querySelector('[data-ajbox="'+CSS.escape(b.dataset.aj)+'"]'); bx.hidden = !bx.hidden; }));
  app.querySelectorAll("[data-ajok]").forEach(b=>b.addEventListener("click", ()=>{ const t = app.querySelector('[data-ajt="'+CSS.escape(b.dataset.ajok)+'"]').value.trim(); if (!t) return; realDb.collection("aprovados").doc(b.dataset.ajok).set({status:"ajustar", nota:t.slice(0,300), at:new Date().toISOString()}).then(()=>toast("Pedido de ajuste enviado.")).catch(()=>{}); }));
  app.querySelectorAll("[data-pct]").forEach(inp=>inp.addEventListener("change", ()=>{ const t = inp.dataset.pct; AFIL[t] = Object.assign({}, AFIL[t]||{}, {pct:Math.max(0,Math.min(100,+inp.value||0))}); W("afiliados", {map:AFIL}).then(()=>toast("Comissão salva.")).catch(()=>toast("Não consegui salvar.")); }));
  const af = $("af-ok"); if (af) af.addEventListener("click", ()=>{ const t = $("af-t").value.trim().toUpperCase().replace(/^.*-/,""); const pc = +$("af-p").value; if (!t || !(pc>=0)) { toast("Preencha código e %."); return; } AFIL[t] = {pct:Math.min(100,pc), nome:$("af-n").value.trim().slice(0,40)}; W("afiliados", {map:AFIL}).then(()=>{ toast("Comissão de "+pc+"% para "+t+"."); telaPainel(); }).catch(()=>toast("Não consegui salvar.")); });
  const pr = $("pr-ok"); if (pr) pr.addEventListener("click", ()=>{ PRECOS = {mensal:+$("pr-m").value||29.9, anual:+$("pr-a").value||299, teste:+$("pr-t").value||7, comissao:+$("pr-k").value||25}; W("precos", PRECOS).then(()=>{ toast("Preços salvos."); telaPainel(); }).catch(()=>toast("Não consegui salvar.")); });
  const cu = $("cu-ok"); if (cu) cu.addEventListener("click", ()=>{ const c = $("cu-c").value.trim().toUpperCase(), p2 = +$("cu-p").value; if (!c || !(p2>0 && p2<=100)){ toast("Preencha código e %."); return; } CUPONS = CUPONS.filter(x=>x.codigo!==c).concat([{codigo:c, pct:p2, ate:$("cu-a").value||""}]); W("cupons", {lista:CUPONS}).then(()=>{ toast("Cupom criado."); telaPainel(); }).catch(()=>toast("Não consegui salvar.")); });
  app.querySelectorAll("[data-cdel]").forEach(b=>b.addEventListener("click", ()=>{ CUPONS.splice(+b.dataset.cdel,1); W("cupons", {lista:CUPONS}).then(()=>telaPainel()).catch(()=>{}); }));
  const cd = $("cod"); if (cd) cd.addEventListener("click", ()=>{ const c = novoCodigo(); W("convite", {codigo:c, at:new Date().toISOString()}).then(()=>{ CODIGO = c; telaPainel(); }).catch(()=>toast("Não consegui salvar.")); });
  const iv = $("inv"); if (iv) iv.addEventListener("click", ()=>copiar(convite()));
  const wa = $("waok"); if (wa) wa.addEventListener("click", ()=>{ const v = $("wa").value.trim(); if (v && !/^https:\/\/wa\.me\/\d{10,15}$/.test(v)){ toast("Use o formato https://wa.me/55DDDNÚMERO"); return; } CONTATO = v; W("contato", {wa:v}).then(()=>toast("Contato salvo.")).catch(()=>{}); });
  const dm = $("demo"); if (dm) dm.addEventListener("click", startDemo);
  if (user && painelAba==="pessoas"){ const need = pend.filter(id=>!(id in PROFN)); if (need.length) user.profiles(need).then(ps=>{ need.forEach(id=>{ PROFN[id] = (ps[id]&&ps[id].name)||""; }); if (R.tab==="painel") telaPainel(); }).catch(()=>{}); }
}
function startDemo(){
  DEMO = true; db = memDB(); me = "demo-amigo"; meName = "Amigo de teste"; meAv = ""; isOwner = false; P = null; A = null; ACESSO = {status:"aceito", via:"demo", indicadoPor:"DEMO"}; LOG = {}; step = 0;
  Object.keys(draft).forEach(k=>delete draft[k]); SOC = {posts:[], people:{}, follows:{}, kudos:{}, notifs:[], desafios:[], desafiosGanhos:0}; seedSocial(); carregarPostsDono(realDb);
  R.tab = "hoje"; R.sub = null; telaAbertura();
}

/* ===================== ROTEAMENTO E INÍCIO ===================== */
let entrou = false;
function rotear(clique){
  if (clique) entrou = true;
  if (!me){ telaAbertura(); return; }
  if (!isOwner && !(ACESSO && ACESSO.status==="aceito")){ if (!entrou){ telaAbertura(); return; } if (ACESSO && ACESSO.status==="recusado"){ telaPedido(); return; } telaCodigo(); return; }
  if (!P || !P.perfil){ if (!entrou && !step){ telaAbertura(); return; } onb(Math.min(step||0, 5)); return; }
  if (!P.perfil.compromisso){ telaPlanoPronto(); return; }
  if (!P.perfil.assinatura){ telaAssinatura(); return; }
  const red = P.perfil.flags && P.perfil.flags.red && P.perfil.flags.red.length;
  if (!isOwner && !(A && A.status==="aprovado")){ if (A && A.status==="ajustar"){ telaRevisao(); return; } if (red || (P.viol && P.viol.length) || !planoAtual()){ telaRevisao(); return; } }
  if (!planoAtual()){ telaRevisao(); return; }
  render();
}
document.querySelector(".tabs-pill").addEventListener("click", e=>{ const b = e.target.closest("button[data-tab]"); if (!b) return; if (b.dataset.tab==="feed") feedView = "feed"; if (b.dataset.tab==="treino") semOff = 0; ir(b.dataset.tab); });
$("fab").addEventListener("click", ()=>ir("chat"));
(async ()=>{
  try{ const r = JSON.parse(localStorage.getItem("ar2-draft")||"null"); if (r){ Object.assign(draft, r.draft||{}); step = r.step||0; } }catch(e){}
  if (!window.claude || !window.claude.use){ telaAbertura(); return; }
  tela('<span class="wm"><i></i>'+esc(BRAND)+'</span><p class="s">Carregando…</p>');
  [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  db = wrapDb(db);
  window.claude.use("sample").then(s=>{ sample = s; }).catch(()=>{});
  if (user){ try{ const v = await user.me(); me = v.id; meName = v.name; meAv = v.avatarUrl; isOwner = !!v.isOwner; }catch(e){} }
  if (user && typeof user.can === "function"){ try{ PODE_ESCREVER = await comTempo(user.can("data.write"), 4000); }catch(e){} }
  if (!db || !me){ telaAbertura(); return; }
  realDb = db;
  if (!isOwner){ let ok = false; try{ await Promise.race([db.collection(base()).doc("ping").set({at:new Date().toISOString()}), new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}), 6000))]); ok = true; }catch(e){} if (!ok){ LOCAL = true; db = hybrid(realDb); } }
  const cfg = (doc, f) => { try{ realDb.collection("config").doc(doc).onSnapshot(s=>{ f(s.exists ? (s.data()||{}) : {}); }, ()=>{}); }catch(e){} };
  cfg("convite", d=>{ CODIGO = String(d.codigo||""); if (!CODIGO && isOwner){ const c = novoCodigo(); CODIGO = c; realDb.collection("config").doc("convite").set({codigo:c, at:new Date().toISOString()}).catch(()=>{}); } });
  cfg("contato", d=>{ CONTATO = d.wa||""; });
  cfg("precos", d=>{ if (d.mensal) PRECOS = Object.assign(PRECOS, d); });
  cfg("cupons", d=>{ CUPONS = Array.isArray(d.lista) ? d.lista.filter(c=>!c.ate || c.ate>=key(today)) : []; });
  cfg("afiliados", d=>{ AFIL = d.map || {}; });
  try{ const [pf, lg, rc, so] = await Promise.all(["perfil","log","rascunho","social"].map(d=>db.collection(base()).doc(d).get())); if (pf.exists){ const v = pf.data(); if (v && v.perfil) P = v; } if (lg.exists) LOG = (lg.data()||{}).log||{}; if (rc.exists && !P){ const r = rc.data()||{}; Object.assign(draft, r.draft||{}); step = r.step||step; } if (so.exists) SOC = Object.assign(SOC, so.data()||{}); }catch(e){}
  if (!SOC.posts.length && !Object.keys(SOC.people||{}).length) seedSocial();
  if (P && P.plano && (P.plano.versao||1)<2 && P.perfil){ const np = gerarPlano(P.perfil); if (np){ P.plano = np; delete P.planoProf; P.viol = validar(np, P.perfil); salvarPerfil(); } }
  try{ const pd = await db.collection("pedidos").doc(me).get(); if (pd.exists) PEDIDO = pd.data(); }catch(e){}
  try{ const ac = await db.collection("acessos").doc(me).get(); if (ac.exists) ACESSO = ac.data(); }catch(e){}
  if (!ACESSO && !isOwner){ try{ ACESSO = JSON.parse(localStorage.getItem("ar2-acesso-"+me)||"null"); }catch(e){} }
  db.collection("acessos").doc(me).onSnapshot(s=>{ const prev = ACESSO && ACESSO.status; ACESSO = s.exists ? s.data() : null; if (!isOwner && (ACESSO&&ACESSO.status)!==prev && entrou) rotear(); }, ()=>{});
  db.collection("aprovados").doc(me).onSnapshot(s=>{ const prev = A && A.status; A = s.exists ? s.data() : null; if (P && !isOwner && (A&&A.status)!==prev && entrou) rotear(); }, ()=>{});
  if (isOwner){
    const re = () => { if (R.tab==="painel" && !DEMO) telaPainel(); };
    realDb.collection("revisao").onSnapshot(s=>{ Object.keys(REV).forEach(k=>delete REV[k]); s.docs.forEach(d=>{ REV[d.id] = d.data()||{}; }); re(); }, ()=>{});
    realDb.collection("aprovados").onSnapshot(s=>{ s.docs.forEach(d=>{ APR[d.id] = d.data()||{}; }); re(); }, ()=>{});
    realDb.collection("pedidos").onSnapshot(s=>{ Object.keys(PED).forEach(k=>delete PED[k]); s.docs.forEach(d=>{ PED[d.id] = d.data()||{}; }); re(); }, ()=>{});
    realDb.collection("acessos").onSnapshot(s=>{ s.docs.forEach(d=>{ ACS[d.id] = d.data()||{}; }); re(); }, ()=>{});
    realDb.collection("resumo").onSnapshot(s=>{ s.docs.forEach(d=>{ RES[d.id] = d.data()||{}; }); re(); }, ()=>{});
  }
  carregarPostsDono(realDb);
  carregarGrupos();
  Pro.aoMudar = aoMudarPro;
  try{ Pro.iniciar().catch(()=>{}); }catch(e){}
  entrou = !!(P && P.perfil);
  rotear();
})();

})();
