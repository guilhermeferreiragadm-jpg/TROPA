, progressivo a cada 2 semanas) → Específico 2–3 semanas (3×3 km ou 2×5 km em ritmo de meia; longão com 5–8 km no ritmo de meia) → Polimento 10–14 dias. O longão do plano do app manda (S14 = 16,5 km; S15 = 12 km).\nPOLIMENTO [E, Bosquet 2007]: cortar 41–60% do volume, MANTER intensidade e frequência; último longão 7 dias antes (31/01). S16 sem Força A e sem Hyrox.\nMETA REALISTA [O]: com consistência, VDOT 35–37 → 1:58–2:05 (o app usa 1:55–2:10). Confirmar com teste de 10 km ou 30 min no início de janeiro.\nPACING [C/E]: uniforme ou levemente negativo. km 1–5: ritmo alvo +5–10 s/km; km 6–15: no alvo (esforço 6–7, ~90–93% da LTHR); km 16–21: acelera se sobrar. Cada 10 s/km rápido demais no início custa mais do que ganha.\nPRÉ-PROVA: refeição rica em carbo 3–4 h antes; na prova (~2 h), 40–60 g/h = gel a cada 30–40 min, já testado nos longões. Cafeína só se testada (máx. 200 mg/dia, nada após 16h). Nada novo no dia (tênis, gel, meia).\nDEPOIS: 7–14 dias de recuperação antes da base de triathlon; não tratar a meia como 'prova da vida' a ponto de perder 3 semanas."}, {"id": "bike_zonas", "titulo": "Bike: zonas, FTP e treino sem potência (spinning)", "tags": ["bike", "bicicleta", "spinning", "indoor", "rolo", "ftp", "potência", "potencia", "watts", "zona de bike", "cadência na bike", "rpm", "teste de bike", "fc na bike"], "texto": "ZONAS COGGAN (% FTP) [C]: Z1 <55% (pedal solto, esforço 1–2) · Z2 56–75% (conversa, 3–4) · Z3 76–90% (frases curtas, 5–6) · sweet spot 88–94% (6–7) · Z4 91–105% (palavras soltas, 7–8) · Z5 106–120% (ofegante, 3–8 min, 9) · Z6/7 sprint. Por FC de limiar da bike (Friel, conferir): Z2 81–89%, Z3 90–93%, Z4 94–99%.\nTESTES: FTP 20 min = 95% da média (iniciante superestima; na dúvida 90–92%). Rampa = 75% do melhor minuto. Retestar a cada 6–8 semanas, no fim da descarga [C].\nSEM POTÊNCIA (até fev/2027) [C]: FC é a métrica principal e o esforço é a âncora. Teste de FC de limiar (Friel): 30 min sozinho, máximo uniforme; FC média dos últimos 20 min. No spinning a carga do botão não é calibrada: usar sempre a mesma bike, a mesma posição do botão e a mesma cadência = 'pseudo-potência' [O]. A FC atrasa 1–3 min e sobe com calor, cafeína e cansaço: tiros curtos (30/15, VO2) por esforço; blocos longos de Z2 por FC. Drift >5% na 2ª metade = base fraca ou desidratação.\nUma hora no indoor ≈ 1h15–1h20 na rua (não tem descida nem parada) [O]. Indoor >2h rende pouco. CADÊNCIA: 80–95 rpm normal; não forçar cadência baixa.\nCOMPRA [O]: rolo smart ou medidor de potência a partir de fev/2027 deixa pacing e carga muito mais precisos, mas dá para fazer bem o 70.3 só com FC + esforço."}, {"id": "bike_treinos", "titulo": "Bike: tipos de treino", "tags": ["bike", "bicicleta", "spinning", "sweet spot", "tempo", "limiar", "vo2", "30/15", "intervalo na bike", "força na bike", "big gear", "cadência alta", "uma perna", "pedal longo", "treino de bike"], "texto": "NO APP: até a meia só Z2 no sábado; sweet spot a partir da F5; VO2/30/15 não estão no plano (só via Tribunal). As séries abaixo são o repertório para quando a fase pedir.\nDISTRIBUIÇÃO: ~80% do tempo em Z1–Z2 e no máx. 2 sessões de qualidade/semana somando bike + corrida [C]. Polarizado (Seiler; Stöggl 2014) e sweet spot (TrainerRoad) funcionam para quem tem pouco tempo; o risco é viver na zona cinzenta [E/O].\n· Z2/endurance: 60–90 min indoor ou 1h30–3h30 na rua a 65–75% FTP / 81–89% LTHR; sem picos nas subidas (teto ~85% LTHR).\n· Tempo (Z3): resistência específica do 70.3 (ritmo de prova = Z2 alta/Z3 baixa): 3×15 → 2×30 → 60 min a 76–85%.\n· Sweet spot: 3×10 → 3×15 → 2×20 min a 88–94%, 5 min de pausa.\n· Limiar: 4×8 → 3×12 → 2×20 min a 95–105%, pausa de metade a igual ao tiro.\n· VO2: 5×3 → 5×4 → 4×5 min a 106–120% (esforço 9), pausa igual. 30/15 de Rønnestad [E, amostra pequena]: 3 séries de 13×(30 s forte/15 s leve), 3 min entre séries; iniciante começa com 2×10, 1x/sem, só depois de 8–12 semanas de base.\n· Técnica: uma perna 4×1 min cada; spin-ups até 110–120 rpm sem quicar no selim [C].\n· Big gear: 4–6×5 min a 50–60 rpm em Z3 sentado; evidência fraca, não substitui academia [E].\n· Pedal longo: Z2 na base; blocos em ritmo de prova na fase específica."}, {"id": "bike_rua", "titulo": "Bike: progressão até 90 km, bike fit e habilidades", "tags": ["bike", "bicicleta", "90 km", "pedal longo", "rua", "bike fit", "selim", "altura do selim", "clip", "aero", "posição", "clipar", "sapatilha", "curva", "descida", "pelotão", "vácuo", "drafting", "pneu", "furou", "câmara", "comprar bike", "speed"], "texto": "NO APP até a meia: 1 bike indoor/sem (sábado, só Z2, 60–75 min, esforço 3–4); sweet spot só a partir da F5 (sexta); VO2 e 30/15 só se o Tribunal incluir. RUA (fev–set/27) [C/O]: 3–4 h/sem → 6–8 h no pico (jul–ago), 3 sobem : 1 desce (−30–40%). Pedal longo +10–15 min/sem: fev 1h15–1h30 (30–40 km, só Z2 e habilidade) · mar–abr 2h–2h30 (50–70 km; de abr 2×15 min em ritmo de prova) · mai–jun 2h30–3h (70–85 km; 2×30 → 3×20 min ritmo de prova) · jul–ago 3h–3h30 (90–100 km; 2–3 pedais ≥ duração da prova com 60–75% em ritmo de prova + corrida curta). Último de 90 km 3 semanas antes; último de 2h 10–14 dias antes. Pelo menos 1 pedal longo/sem na rua na fase de prova.\nBIKE FIT [C]: ordem: altura do selim > recuo > taquinho > alcance/altura do guidão > selim. Joelho com 25–35° de flexão embaixo (medido parado) [E]; ajustar de 2–3 mm. Sinais: quadril balançando/dor atrás do joelho = selim alto; dor na frente do joelho = selim baixo/adiantado; lateral = taquinho; mão dormente/pescoço = alcance longo; lombar = alcance longo ou core fraco. Bike fit na F4 (fev), com revisão após 4–6 semanas na rua.\nAERO: começar com speed + clip ajustado. Adaptação 4×5 min → 20–40 min contínuos; na prova 70–90% no clip. Regra: conforto > respirar > potência > aero.\nHABILIDADES [C]: clipar no rolo/grama com tensão mínima, desclipar antes de parar. Curva: frear antes, em linha reta; pedal de fora embaixo; olhar a saída; molhado/faixa pintada = zero inclinação. Descida: mãos embaixo (nunca no clip em descida técnica), peso atrás, freio em pulsos (dianteiro ~60–70%). Treinar beber/comer pedalando, olhar para trás sem desviar e pegar garrafa.\nPNEU: treinar 5–10x em casa até <5 min; kit 2 espátulas + câmara + CO2/bomba; passar o dedo dentro do pneu antes da câmara nova.\nVÁCUO NA PROVA [C]: proibido; zona de 12 m, 25 s para ultrapassar, manter a direita, quem foi ultrapassado sai da zona. 70.3: blue card de 2 min (regra 2025+); acúmulo desclassifica. Confirmar zona e penalidade no Athlete Guide 2027. Fone proibido."}, {"id": "forca", "titulo": "Força: por que, exercícios e prescrição", "tags": ["força", "forca", "academia", "musculação", "musculacao", "agachamento", "terra", "rdl", "búlgaro", "bulgaro", "stiff", "hip thrust", "panturrilha", "nórdico", "nordico", "core", "prancha", "pliometria", "salto", "carga", "série", "series", "repetições", "reps", "rir", "falha", "hipertrofia", "ganhar massa", "físico", "fisico", "perna", "superior", "costas", "peito"], "texto": "POR QUÊ [E]: força + endurance melhora a economia de corrida 2–8% (Blagrove 2018) e a do pedal/potência no VO2max (Rønnestad & Mujika 2014), sem ganhar peso (Beattie 2017). Pesado (≥80% 1RM, 3–6 reps) tem o efeito mais consistente; pliometria sozinha é trivial, junto com força é grande (Dudagoitia 2023). Hipertrofia não é a meta, é tolerada. Força reduz lesão esportiva a <1/3 (Lauersen 2014). NO PLANO DO APP as reps seguem a fase (S2–5 12–15, S6–9 8–10, S10–11 2×8, S12–15 2×6–8, S18–19 3×6–8, S20–31 3–4×4–6, build 1x 2×4–6). Sem teste de 1RM e sem falha.\nEXERCÍCIOS (técnica → erro → progressão):\n· Agachamento: joelho na linha do 2º–3º dedo, tronco firme, até paralela. Erro: joelho caindo pra dentro, 'good morning' na subida. Goblet → frontal → costas.\n· Terra romeno: dobradiça de quadril, joelho levemente dobrado, barra raspando a coxa, coluna neutra. Erro: arredondar lombar. Bilateral → unilateral.\n· Búlgaro: pé de trás só apoia; tronco inclinado = mais glúteo. Erro: passada curta, joelho caindo. Split → búlgaro → com carga. Comparar as pernas (diferença <10%).\n· Step-up (empurra só pela perna de cima) e step-down excêntrico 3–4 s (controle de joelho).\n· Hip thrust: escápula no banco, pausa 1–2 s em cima, sem hiperestender a lombar.\n· Panturrilha: sóleo (sentado, joelho dobrado; aguenta ~6–8x o peso na corrida) e gastrocnêmio (em pé, joelho reto); 3–4×8–15 pesado, pausa 2 s embaixo, descida 3 s; meta 25+ reps numa perna só antes de subir volume de corrida [O].\n· Nórdico: −~50% de lesão de posterior [E, van Dyk 2019]; 2–3×3–6, começar 1×5 (dá muita dor tardia).\n· Core (McGill Big 3: curl-up, prancha lateral, bird-dog; Pallof press; carregamento unilateral): resistência, não fadiga.\n· Pliometria: pogo → skips → caixa → lateral → unipodal → drop jump baixo; 40–60 contatos/sessão no início; aterrissar silencioso e alinhado.\nPRESCRIÇÃO (literatura; no app vale a fase acima): força máx 3–4×4–6 pesado com RIR ≥2 (só a partir da S20), 2–4 min de pausa; resistência 2–4×8–15, RIR 1–3, 60–120 s. Para endurance EVITAR a falha [C, ACSM]. 4–8 séries/semana por padrão de movimento bastam [O]. DUPLA PROGRESSÃO: quando todas as séries batem o topo da faixa com RIR ≥2, sobe 2,5–5 kg e volta ao piso (no app: só com 24 h sem dor >2/10 e sem inchaço). Na semana de descarga do app: 1 série a menos."}, {"id": "concorrente", "titulo": "Como encaixar força com corrida, bike e Hyrox", "tags": ["mesmo dia", "dois treinos", "2 treinos", "ordem", "antes ou depois", "interferência", "encaixar", "horário", "manhã", "noite", "concorrente"], "texto": "EVIDÊNCIA [E]: interferência na força vem mais da corrida que da bike e cresce com frequência/duração (Wilson 2012). Treino concorrente não atrapalha força máxima nem hipertrofia, mas atrapalha potência explosiva, principalmente na mesma sessão (Schumann 2022).\nREGRAS [O/E]:\n· Força pesada no MESMO dia de um treino duro (dia duro duro, dia fácil fácil). É o que o app faz: intervalado sex 16h + força de pernas 19h30.\n· Ideal ≥6 h entre as sessões; no app, mínimo 3 h (aprovado). Se fizer junto, primeiro o que é prioridade.\n· No app: Força A de pernas na sexta (≥3 h depois do intervalado) é a regra aprovada; sábado só Z2. Na F5, com pedal de sábado ≥2h30, a Força A cai para 3×5 RIR 3. Evitar força pesada de perna na véspera do intervalado.\n· Pliometria depois do aquecimento e antes da força, nunca no fim de treino exaustivo.\n· Hyrox conta como dia DURO (força-resistência + corrida), nunca como recuperação ou extra.\n· Natação e bike leve são os melhores 'coringas' em dia fácil."}, {"id": "hyrox", "titulo": "Hyrox: técnica e dosagem no ano do 70.3", "tags": ["hyrox", "sled", "trenó", "wall ball", "wallball", "skierg", "ski", "remo", "burpee", "lunge", "afundo", "farmers", "sandbag", "roxzone", "estação", "estações"], "texto": "FORMATO (Men Open): 8×(1 km de corrida + estação): SkiErg 1.000 m · sled push 50 m (152 kg) · sled pull 50 m (103 kg) · burpee broad jump 80 m · remo 1.000 m · farmers carry 200 m (2×24 kg) · sandbag lunges 100 m (20 kg) · wall ball 100 (6 kg). ~60% endurance / 40% força [O].\nTÉCNICA [O]: sled push: corpo ~45°, braços estendidos, passos curtos pela ponta do pé, quem empurra é o quadril. Sled pull: centro de gravidade baixo, mão sobre mão andando pra trás, pernas ativas. Wall ball: agacha completo e lança na subida, FRACIONAR cedo (10–15 com 5–10 s de pausa). Lunges: joelho de trás encosta leve, tronco reto, ritmo constante. SkiErg: começa no quadril/core. Remo: pernas→tronco→braços, recuperação 2x mais lenta. Burpee broad jump: ritmo fixo, salto médio. Roxzone: nunca andar; treinar correr logo depois da estação. Pacing: o erro clássico é sair forte no 1º km e no SkiErg.\nDOSE NO ANO DO 70.3 [O]: Hyrox conta como dia duro e não substitui força pesada (é força-resistência). NO APP: meia → S15 Hyrox técnico e leve, S16 sem Hyrox; build do 70.3 → quinzenal, em formato reduzido (4 estações, carga moderada, esforço 7); sem Hyrox nas 2 últimas semanas antes do 70.3.\nRISCOS: ainda sem estudo de lesão por estação. Padrão clínico: joelho (lunges, wall ball cansado), ombro (wall ball), lombar (sled com tronco desabando no fim), Aquiles (corrida/burpee). Técnica degradou → para a série."}, {"id": "mobilidade", "titulo": "Aquecimento, mobilidade, alongamento e prevenção", "tags": ["aquecimento", "aquecer", "mobilidade", "alongamento", "alongar", "rolo de liberação", "foam roller", "prevenção", "prevenir", "dor muscular", "doms", "dolorido", "recuperação"], "texto": "PREVENÇÃO [E]: força reduz lesão a <1/3 e lesão por sobrecarga quase pela metade; alongamento NÃO previne (RR 0,96) (Lauersen 2014). Pilares do corredor: panturrilha/sóleo, nórdico, step-down, glúteo médio e progressão sem picos.\nAQUECIMENTO RAMP (NSCA) 10–15 min: Raise 3–5 min cardio leve → Ativar/Mobilizar (monster walk com elástico, ponte, mobilidade dinâmica de quadril, tornozelo e torácica) → Potencializar (2–3 séries de aproximação + 2–3 saltos/skips).\nALONGAMENTO [E, Behm 2016]: estático antes do treino tira ~3,7% de performance; ≤45–60 s por músculo dentro de um aquecimento completo é desprezível. Antes: dinâmico. Depois ou em outra hora: estático para ganhar amplitude a longo prazo (≥5 min/sem por músculo); não reduz dor muscular nem lesão de forma relevante. Força em amplitude completa já melhora mobilidade.\nDOR MUSCULAR TARDIA: normal 24–72 h após treino novo/excêntrico (nórdico, lunges); trote/bike leve ajudam a sensação. >72 h ou articular → ver regra da dor."}, {"id": "natacao", "titulo": "Natação: CSS, séries, técnica e águas abertas", "tags": ["natação", "natacao", "nadar", "piscina", "css", "braçada", "bracada", "respiração", "respirar", "pernada", "palmar", "pull", "educativo de natação", "águas abertas", "mar", "represa", "neoprene", "sighting", "orientação", "nado"], "texto": "TESTE CSS (Swim Smooth) [O]: aquecer, 400 m máximo, 5–10 min leve, 200 m máximo. CSS/100 m = (T400 − T200) ÷ 2 ≈ ritmo de 1.500 m. Se o 200 sair mais lento por 100 m que o 400, o 400 foi forte demais → repetir. Retestar a cada 6–8 semanas. Velocista de 100/200 costuma largar forte no 400 (olhar o 1º split).\nSÉRIES: limiar 10–20×100 em CSS +0–2 s com 10–15 s de pausa, ou 4–5×400 em CSS +3 s · aeróbio 3–5×500–800 em CSS +6–10 s ou 2 km contínuo · ritmo de prova 70.3 = CSS +4–8 s/100 m · largada 8×50 forte · pull com palmar e boia (palmar adequado ao ombro). No app: 2 sessões/sem (CSS seg; aeróbica qua), 1,5–2,5 km cada. Para ex-nadador basta; o tempo extra vai para a bike (o limitante) [O, Friel].\nERROS DO EX-NADADOR → EDUCATIVOS: perdeu a pegada → sculling 4×25, cachorrinho, punho fechado · pernada de 6 tempos de velocista gasta energia → pull com boia, pernada de 2 tempos · respira de um lado só → bilateral a cada 3 (precisa para navegar) · desliza demais → subir frequência (60–70 → 70–85 braçadas/min, Tempo Trainer) · cruza a linha do meio → 6-1-6 · cotovelo baixo → braço único, high elbow com palmar pequeno.\nÁGUAS ABERTAS [O]: sighting a cada 6–9 braçadas (3–4 com onda), 'olhos de crocodilo' e depois vira pra respirar; treinar 2×25 por série na piscina. Mirar ponto alto (prédio, árvore). Largada: posicionar pelo tempo; ex-nadador pode ir na frente por fora; 200 m firmes e depois assenta. Vácuo na água é permitido e economiza ~10–20% [E]. Neoprene: 4–6 treinos com ele antes, lubrificante no pescoço, reduz a pernada.\nNEOPRENE IRONMAN (faixa etária) [C]: até 24,5 °C permitido; 24,6–28,8 °C pode haver onda opcional sem premiação/vaga; >28,8 °C proibido. Sem nadadeira, palmar ou snorkel. Pode segurar parado em caiaque/boia sem ser puxado.\nSEGURANÇA: nunca nadar sozinho em água aberta; boia de cor viva; pânico → de costas, braço levantado, respira; <16 °C: aclimatar e touca dupla."}, {"id": "triathlon", "titulo": "Triathlon: estrutura do ano, brick, simulados e transições", "tags": ["triathlon", "brick", "transição", "transicao", "t1", "t2", "simulado", "prova b", "sprint", "olímpico", "olimpico", "3 modalidades", "temporada", "periodização", "fase"], "texto": "ANO [O, Friel/Dixon]: base com corrida em 1º plano (nov–dez) → construção da meia (jan–fev; bike em manutenção) → meia + 7–14 dias de regeneração → base de triathlon (mar–abr; foco no volume de bike, ~50% da prova) → construção 70.3 (mai–jul; sweet spot/ritmo de prova, brick, águas abertas) → específico (ago; 2–3 simulados; prova B 6–8 sem antes) → polimento + prova (set). Ciclos 3:1. CTL subindo 3–5 pontos/sem (>8 aumenta lesão) [O]. Ex-nadador: treinar a fraqueza (bike/corrida).\nBRICK [E fraca]: pedalar antes piora a corrida logo depois (passada mais curta, Olcina 2019); o benefício é neuromuscular/específico. No app: brick curto de 10 min nos sábados a partir da S6; de mar/27 em diante: maioria = 10–20 min de corrida Z2 após a bike (5 min iniciais em ritmo de prova); a cada 2–3 sem, brick de prova (pedal longo + 30–45 min de corrida). Opção: 4–5×(10 min bike forte + 1,5 km corrida). Cadência 80–90 rpm.\nSIMULADOS: 2 entre 4 e 8 semanas antes (1.900 m + 70–90 km em ritmo de prova + 8–12 km); mesma nutrição, equipamento e horário da prova. Nunca a meia completa no simulado (custa 1–2 semanas). Prova B (sprint/olímpico) 6–8 semanas antes.\nTRANSIÇÕES [C/O]: capacete AFIVELADO antes de tocar na bike e só solta com a bike no rack (senão penalidade). Bike sempre empurrada na área; monta/desmonta só nas linhas. T1: neoprene até a cintura correndo, resto no rack. T2: tênis com cadarço elástico, viseira e número correndo. Decorar o caminho contando fileiras. Treinar 4–6 transições em 20 min 1x/sem no build. Meta T1 <4 min, T2 <2 min."}, {"id": "carga", "titulo": "Monitorar carga, cansaço e overtraining", "tags": ["cansado", "cansaço", "cansaco", "exausto", "sem energia", "fadiga", "overtraining", "vfc", "hrv", "fc de repouso", "batimento de repouso", "sono", "dormi mal", "dormir", "carga", "tss", "ctl", "garmin", "relógio", "relogio", "estressado", "prova da faculdade", "semana pesada", "dormi", "dormindo", "horas de sono", "acordei", "noite mal dormida", "sem dormir"], "texto": "sRPE (Foster) [E]: esforço 0–10 × minutos, anotado 30 min depois; junta corrida, bike, natação, força e Hyrox numa moeda só. Subida semanal ≤10–15% [C].\nTSS/CTL/ATL/TSB [C]: TSS = h × IF² × 100; CTL ~42 dias ('forma física'), ATL ~7 dias ('fadiga'), TSB = CTL − ATL. Treino: TSB −10 a −30; abaixo de −30 >1 semana = alerta. Prova: +5 a +20. TSS de corrida 'custa' mais que o de bike (impacto). CTL alvo de um estreante no 70.3 ~60–80 [O]. Sem potência: hrTSS (bom em esforço estável, subestima tiros).\nVFC [E, Plews; Javaloyes 2019]: medir ao acordar, sempre na mesma posição, 1–5 min, lnRMSSD; média de 7 dias dentro da faixa (base ± 0,5 DP) → treina; fora → troca intensidade por Z1/folga. Precisa ≥3–5 medidas/sem. Média caindo + variação subindo = má adaptação.\nSONO: jovem precisa 8–9 h (mínimo 7); <7 h por 2 noites → cortar intensidade.\nOVERREACHING (Meeusen 2013, ECSS/ACSM) [C]: funcional (dias, desejado no bloco) · não funcional (semanas; parar intensidade 1–3 sem) · overtraining (meses; médico). Sinais: rendimento caindo mesmo descansado, FC que não sobe nos tiros, irritação, sono ruim mesmo cansado, doenças repetidas, pouca fome, peso caindo, VFC baixa >7 dias. Descartar com médico: déficit de energia (REDs), ferro/ferritina baixos, infecção, estresse (provas da faculdade). Conduta: 2+ sinais por >5 dias → 1 semana só Z1 com 50% do volume, depois reteste."}, {"id": "prova703", "titulo": "IRONMAN 70.3: pacing, nutrição, polimento e imprevistos", "tags": ["70.3", "ironman", "meio ironman", "prova", "dia da prova", "pacing", "estratégia", "nutrição na prova", "gel", "géis", "carboidrato por hora", "polimento", "taper", "corte", "neoprene", "câimbra", "caimbra", "estômago", "calor na prova"], "texto": "NATAÇÃO 1,9 km: 100–200 m firmes para achar um pé, depois CSS +4–8 s. 'Ganhar 2 min na água não vale perder 10 na corrida.'\nBIKE 90 km [C/O]: IF (NP/FTP) 0,68–0,78 para estreante com split de ~3h–3h30 (Best Bike Split; quanto mais longo, menor o IF); VI ≤1,05 plano / ≤1,10 com subida; subida até ~110% do alvo, nunca no limiar; TSS da bike ≲170. Sem potência: FC Z2 alta (~83–90% LTHR da bike), esforço 5–6, frases curtas. Primeiros 15–20 min ABAIXO do alvo (FC vem inflada da natação). 2ª metade igual ou um pouco mais forte. Últimos 5–10 min: cadência alta para soltar. Se a corrida 'arrasta' na 1ª metade, o erro foi na bike.\nCORRIDA 21,1 km: espere 5–15% mais lento que a meia isolada (estreante pode ser mais). km 0–5: 10–15 s/km mais lento que o plano, esforço 5–6 (as pernas mentem); meio: constante, FC Z2 alta/Z3 baixa; últimos 5–7 km: o que sobrar. Andar 10–15 s nos postos para beber/comer é estratégia válida.\nNUTRIÇÃO [E, Jeukendrup]: bike 60–90 g carbo/h (acima de 60 g: glicose:frutose ~2:1; chegar a 90 exige treinar o intestino, +~15 g/sem nos pedais longos); corrida 40–60 g/h; líquido pela sede (~400–800 ml/h, nunca terminar mais pesado que começou: risco de hiponatremia); sódio 300–600 mg/h, até ~1.000 no calor. Começar aos 15 min de bike. Pesar antes/depois dos treinos para saber o suor. Mesmo gel/bebida em ≥3 pedais longos. Nada novo no dia.\nPOLIMENTO [E, Bosquet 2007]: 10–14 dias; sem −2 ~70% do volume, sem −1 ~40–50%, mantendo tiros curtos em ritmo de prova. D−7 último brick curto; D−2 folga/natação leve; D−1 20 min bike + 10 min corrida com 3 acelerações + 15 min no local da natação + check-in da bike. Carbo 7–10 g/kg/dia nas 24–48 h antes. Café da manhã (refeição) 3–4 h antes com 2–3 g/kg de CARBOIDRATO (~140–210 g). Cafeína ~200 mg 45–60 min antes, só se já testada no treino.\nIMPREVISTOS: pânico na água → peito/costas e respira 30 s (pode segurar no caiaque) · óculos → para e ajusta · pneu → CO2/plug treinado · câimbra → reduz, alonga, sódio + carbo · estômago → só água e reduz 15–20 min, volta a comer aos poucos · calor → gelo no boné, −5–10% no pace · queda de energia → gel + coca no posto seguinte · ficou atrás do plano → NUNCA recuperar acelerando a bike.\nCORTES TÍPICOS (conferir na prova): natação ~1h10, bike ~5h30 da largada, total 8h30."}, {"id": "erros", "titulo": "Erros comuns de iniciante (triathlon e corrida)", "tags": ["erro", "erros", "iniciante", "dica", "dicas", "o que evitar", "conselho"], "texto": "1) Treino fácil feito moderado (zona cinzenta) e treino duro sem ser duro de verdade. 2) Treinar no ritmo da meta e não no atual. 3) Pico no longão ou 'compensar' semana perdida. 4) Pular a força. 5) Copiar 180 de cadência ou forçar antepé sem motivo. 6) Correr com dor que piora ou dor num ponto do osso. 7) Sair forte na prova e sair forte da bike. 8) Comer pouco (REDs, fratura por estresse). 9) Dormir <7 h. 10) Trocar tênis/equipamento/bike fit perto da prova. 11) Polimento longo ou curto demais, ou cortar a intensidade no polimento. 12) FTP inflado por teste mal feito. 13) Aero 'pro' logo de cara (dor lombar, não corre depois). 14) Não treinar nutrição (<40 g/h → quebra na corrida). 15) Só indoor e chegar sem curva, descida e posto. 16) Nunca ter trocado pneu. 17) Vácuo por hábito de grupo. 18) Ex-nadador investindo na natação e largando a bike. 19) Não treinar águas abertas e neoprene. 20) Pular a semana de descarga. 21) Não ler o Athlete Guide. 22) Tratar a meia de fev como 'prova da vida' e perder 3 semanas. 23) Strava/KOM em pedal de Z2."}, {"id": "nutricao", "titulo": "Nutrição: travas aprovadas (para o Coach)", "tags": ["comer", "comida", "dieta", "definir", "definição", "definicao", "secar", "emagrecer", "perder peso", "peso", "barriga", "déficit", "deficit", "caloria", "calorias", "proteína", "proteina", "carbo", "carboidrato", "whey", "creatina", "cafeína", "cafeina", "café", "suplemento", "fome", "jejum"], "texto": "Detalhe de comida e foto de prato é com a Nutri; o Coach responde curto e manda pra ela. TRAVAS (sentença v2, Tribunal): déficit de até 300 kcal SÓ na quarta e na quinta das S2–S9 e S18–S27; perda máx. 0,3 kg/sem; peso nunca abaixo de 68,5 kg; nunca déficit nas S12–S16 nem nas 8 semanas finais; 2 sinais de REDs (cansaço que não passa, rendimento caindo, sono ruim, humor baixo, lesão óssea, fome alterada) → para o déficit. Proteína 115–140 g/dia em 4–5 refeições (~25–35 g), ceia proteica 30–40 g nos dias de treino. Carbo acompanha o treino ('fuel for the work'): descanso 213–284 g, leve 284–355, treino 355–500, longão 426–497. Pré-treino 1–2 h antes (banana + pão com mel). Treino >75 min: carbo durante (gel a partir de ~40 min). Cafeína ≤200 mg/dia, nada depois das 16h. Creatina 3–5 g/dia todo dia. Jejum só em corrida fácil <45 min. Definição vem de consistência + força + proteína, não de corte agressivo."}, {"id": "musculacao_hipertrofia", "titulo": "Musculação para ganhar massa", "tags": ["massa", "hipertrofia", "ganhar músculo", "musculação", "academia", "volume", "séries", "repetições", "bulking", "definição"], "texto": "PRÁTICA CONSOLIDADA (não é protocolo médico). Segurança e saúde vêm antes de carga.\nVOLUME: iniciante 8–12 séries semanais por grupo muscular; intermediário 10–20. Mais séries só se ele recupera bem (sono, dor, energia).\nREPETIÇÕES: maior parte entre 6 e 12, perto da falha (sobrar 1 a 3 repetições, RIR 1–3). Exercícios básicos (agachamento, supino, remada, desenvolvimento, terra romeno) primeiro; isoladores depois.\nFREQUÊNCIA: cada grupo 2x por semana costuma render mais que 1x. Descanso de 1,5 a 3 min nas séries pesadas.\nPROGRESSÃO: subir carga pequena quando fechar todas as repetições do topo da faixa; registrar a carga de cada série.\nPROTEÍNA: em geral 1,6 a 2,2 g por kg por dia, distribuída nas refeições; superávit pequeno para ganhar massa, sem passar fome para ficar definido. Não prometa resultado em prazo fechado.\nMENOR DE IDADE: técnica antes de carga, subir de 1 em 1 kg, sem treino até a falha."}, {"id": "maratona", "titulo": "Maratona (42 km)", "tags": ["maratona", "42 km", "42k", "longão de 30", "longao de 30", "primeira maratona"], "texto": "PRÁTICA CONSOLIDADA. Só montar plano de maratona com base de corrida: de preferência já ter feito meia maratona e correr 4+ vezes por semana.\nDURAÇÃO: 16 a 20 semanas, com semanas leves a cada 3 ou 4 (volume cai 20–30%).\nLONGÃO: sobe no máximo ~10% por semana; o maior fica entre 30 e 32 km, 3 a 4 semanas antes da prova, depois polimento de 2 a 3 semanas.\nRITMO: a maior parte do volume em ritmo leve; ritmo de prova só em partes do longão e em 1 treino por semana. Largar mais devagar que a meta nos primeiros 10 km.\nNUTRIÇÃO: treinar a alimentação nos longões (60–90 g de carboidrato por hora, água e sódio) e não testar nada novo na prova.\nSE HOUVER DOR QUE MUDA A PASSADA: parar e procurar profissional; não compensar o treino."}, {"id": "ironman_completo", "titulo": "IRONMAN completo (3,8 km nado + 180 km bike + 42,2 km corrida)", "tags": ["ironman", "ironman 140.6", "140.6", "full", "distância completa", "3,8 km", "180 km"], "texto": "PRÁTICA CONSOLIDADA. Distância completa é um passo acima do 70.3: o ideal é já ter feito um 70.3 e ter 1 ano ou mais de base de triathlon.\nDURAÇÃO: 24 a 36 semanas de preparação específica, com 8 a 14 horas por semana para amadores, e semanas de descarga a cada 3 ou 4.\nTREINOS CHAVE: pedal longo de 4 a 6 h em zona 2 com corrida curta logo depois (brick); longão de corrida até 28–32 km; nado de 3 a 4 km contínuos; simulados de nutrição.\nPACING: na bike, esforço baixo (zona 2 a baixo sweet spot) para chegar com perna para a maratona; ninguém ganha o Ironman na bike.\nNUTRIÇÃO: 60–90 g de carboidrato por hora, líquidos e sódio, tudo testado nos treinos longos.\nSEGURANÇA: exame e avaliação médica antes de começar; não prometa a prova no prazo se a base não existe. Seguir os limites de aumento de volume do núcleo."}, {"id": "corrida_curta", "titulo": "Corrida de 5 km e 10 km", "tags": ["5 km", "5k", "10 km", "10k", "corrida de rua", "tempo de 5", "baixar o tempo"], "texto": "PRÁTICA CONSOLIDADA. Para baixar o tempo de 5 e 10 km: 3 a 5 corridas por semana, sendo 1 longa leve, 1 de ritmo (limiar) e 1 de tiros curtos (de 400 m a 1 km). O resto é leve.\nPROGRESSÃO: sobe no máximo ~10% por semana, com semana leve a cada 3 ou 4.\nRITMO: usar o VDOT calculado do melhor tempo para limiar, tiro e leve; atualizar com uma prova ou teste novo.\nPROVA: aquecimento de 10 a 15 min, largar nos primeiros 1–2 km no ritmo da meta ou um pouco mais lento, acelerar só no fim.\nINICIANTE (do zero): alternar caminhada e corrida, 3x por semana, com um dia de descanso entre eles; avançar quando conseguir 20 a 30 min contínuos sem dor."}];
let KBN = [{"id": "nucleo", "titulo": "Núcleo: guia de alimentação", "tags": [], "texto": "PAPEL: educativo. Explica faixas gerais de consenso com a fonte; não calcula kcal/gramas individuais, não monta cardápio, não sugere déficit, não dá dose de suplemento (isso é com nutricionista). Evidência: [E]/[C]/[O].\nFAIXAS GERAIS (ACSM/AND/DC 2016; ISSN): carbo 3–5 g/kg em dia leve, 5–7 moderado, 6–10 endurance; proteína 1,6–2,0 g/kg/dia em 4–5 refeições; durante treino >75 min 30–60 g/h de carbo, >2,5 h até 90 g/h; beber pela sede em treino curto. Cafeína: efeito com 3–6 mg/kg, mas atrapalha o sono à noite.\nSEGURANÇA: sinais de comer pouco demais (REDs: cansaço que não passa, rendimento caindo, libido baixa, fratura por estresse, ciclo irregular) → indicar médico/nutricionista. Culpa, compensação, restrição, vômito, laxante → acolher, sem números, indicar profissional (CVV 188 se houver risco)."}, {"id": "energia", "titulo": "Gasto energético e ajuste semanal pelo peso", "tags": ["caloria", "calorias", "kcal", "gasto", "gasto calórico", "metabolismo", "tmb", "quanto comer", "quanto eu como", "quanto devo comer", "manter peso", "balança", "peso", "pesei", "engordei", "emagreci", "ganhei peso", "perdi peso", "relógio", "garmin"], "texto": "TMB (Mifflin-St Jeor): 10×71 + 6,25×173 − 5×19 + 5 ≈ 1.700 kcal; em triatletas a Mifflin subestima ~5% → trabalhar com ~1.700–1.800 [E, meta-análise 2023].\nESTIMATIVA [O]: dia sem treino ≈ TMB × 1,4–1,5 (universitário sentado) = ~2.400–2.600 kcal. Somar o gasto LÍQUIDO das sessões: bike com potência kJ ≈ kcal; corrida ~1 kcal/kg/km (~70 kcal/km); natação, força e Hyrox pelo relógio com corte de 10–20%. Média semanal provável ~2.900–3.300 kcal/dia: é HIPÓTESE, não verdade.\nQUEM DECIDE É O PESO MÉDIO [O]: pesar ao acordar 4–7x/sem, média de 7 dias, comparar semana a semana junto com desempenho, sono, fome, humor e libido.\n| Situação (2 semanas) | Ação |\n· Média cai >0,3 kg/sem fora do déficit, ou desempenho cai → +200–300 kcal/dia em carbo nos dias de treino.\n· Em déficit (qua/qui) e média cai até 0,3 kg/sem com treino ok → manter.\n· Média sobe >0,3 kg/sem sem querer → −150–200 kcal em gordura/ultraprocessado, nunca no carbo do treino.\n· Fome forte, sono ruim, irritação, libido baixa → ver REDs, sair do déficit.\n· Treinos-chave 'sem perna' seguidos → checar carbo pré e pós antes de mexer no total.\nNunca reagir a uma pesagem isolada. Relógio exagerado → usar o valor menor e deixar o peso corrigir.\nSe pesar gerar angústia ou obsessão → parar de pesar e ver a seção 'alerta'."}, {"id": "carboidrato", "titulo": "Carboidrato periodizado (quanto por dia e por quê)", "tags": ["carbo", "carboidrato", "carboidratos", "arroz", "macarrão", "pão", "massa", "low carb", "lowcarb", "cetogênica", "cetogenica", "keto", "jejum", "em jejum", "train low", "sleep low", "glicogênio", "energia", "sem energia", "fraco no treino"], "texto": "FAIXAS (ACSM/AND/DC 2016) [C]: leve 3–5 g/kg · moderado ~1 h/dia 5–7 · endurance 1–3 h/dia 6–10. No app: descanso 3–4 g/kg, leve 4–5, treino 5–7, longão 6–7; F5+: pedal longo 7–8 g/kg; F6–F7 até 10 g/kg (os números do cardápio valem).\nFUEL FOR THE WORK (Impey/Morton 2018) [C/O]: o carbo segue a próxima sessão. Intervalado, Hyrox, longão e véspera de sessão-chave → carbo alto antes e depois, NUNCA em jejum. Dia leve → menos carbo, mais vegetais e proteína.\nTRAIN-LOW / JEJUM: a meta-análise (Gejl & Nybo 2021) não mostrou ganho de desempenho com restrição periodizada [E]; só 37% dos estudos de desempenho melhoraram [E]. No app: jejum só em corrida fácil <45 min, nunca em semana de prova nem em dia de déficit.\nLOW-CARB/CETOGÊNICA: queima mais gordura mas piora a economia; marchadores de elite: carbo alto +4,8% e cetogênica −2,3% nos 10.000 m (Burke 2020, replicação de 2017) [E]. Se ele pedir para 'secar' com low-carb → desaconselhar com esse dado.\nErro clássico do amador: comer carbo suficiente no descanso e pouco nos dias de treino; e priorizar proteína cortando carbo [E, LJMU]. Fontes baratas: arroz, feijão, pão francês, mandioca, batata, aveia, banana, tapioca, cuscuz.\nQUINTA DE DÉFICIT (véspera do intervalado de sexta): cortar só gordura/ultraprocessado e manter o carbo do dia (3–4 g/kg)."}, {"id": "proteina", "titulo": "Proteína: quanto, quando e de onde", "tags": ["proteína", "proteina", "proteínas", "whey", "ovo", "ovos", "frango", "carne", "massa muscular", "ganhar massa", "músculo", "musculo", "hipertrofia", "caseína", "caseina", "ceia", "antes de dormir", "vegetariano", "vegano", "soja", "leucina"], "texto": "TOTAL: ACSM 1,2–2,0 g/kg [C]; massa magra estabiliza perto de 1,6 g/kg (Morton 2018) [E]; endurance 1,65–1,83 g/kg (Kato 2016, n pequeno) [E]. No app: 115–140 g/dia (1,6–2,0 g/kg). Em dia de déficit (qua/qui): 128–155 g, em 4–5 refeições de 25–30 g [E/O, Longland 2016 mostrou que proteína alta protege massa magra em déficit].\nDISTRIBUIÇÃO: 4 refeições de 25–40 g (~0,3–0,5 g/kg), a cada 3–4 h [C, ISSN 2017; E, Areta 2013]. 100 g de uma vez não é 'desperdiçado' (Trommelen 2023) [E], mas espalhar ajuda a bater a meta.\nANTES DE DORMIR (ceia, dias de treino): 30–40 g de proteína lenta (leite, iogurte, queijo, ricota/cottage) [E, Res 2012: ~22% mais síntese noturna com 40 g; 30 g foi inconsistente].\nPÓS-TREINO: 20–40 g entre logo após e 2 h depois, com carbo [C].\nVEGETAL x ANIMAL: soja ≈ whey para força (Messina 2018) [E]; refeição só vegetal → aumentar ~20–30% ou combinar (arroz + feijão + soja) [O].\nWHEY: opcional, só se a comida não fechar a meta ou após o longão; comparar preço por grama com ovo, frango, leite [O]. Fontes baratas: ovo, frango, sardinha em lata, carne moída, leite, iogurte natural, feijão + arroz."}, {"id": "gordura_micros", "titulo": "Gordura, fibra, ferro, vitamina D, cálcio e frutas", "tags": ["gordura", "gorduras", "azeite", "ômega", "omega", "ômega 3", "omega 3", "peixe", "sardinha", "fibra", "fibras", "ferro", "anemia", "ferritina", "vitamina d", "vitamina", "cálcio", "calcio", "magnésio", "magnesio", "fruta", "frutas", "verdura", "verduras", "salada", "legumes", "sódio", "sal"], "texto": "GORDURA: 20–35% das kcal; ≤20% não ajuda o desempenho [C, ACSM]. Piso ~0,8–1 g/kg (~60–70 g), mesmo em déficit [O]. Ômega-3: peixe gordo 2x/sem (sardinha em lata é barata); suplemento ajuda um pouco a recuperação, quase nada o desempenho [E] → não é prioridade.\nFIBRA: ~38 g/dia como referência [C, de memória]; reduzir fibra e gordura na refeição 2–3 h antes de treino intenso/prova e compensar nas outras [O].\nFERRO: ~5–11% dos homens atletas têm deficiência; corredor perde por impacto, suor e GI [C]. Ferritina e faixas: ver a seção 'exames' (quem interpreta é o médico). Sinais: cansaço que não passa, pace pior, FC mais alta no mesmo ritmo → pedir exame ao médico. NUNCA suplementar ferro por conta (homem pode ter sobrecarga). Refeição rica em ferro de manhã, com vitamina C, longe de café/chá/leite (um café junto da refeição reduz ~35–40% da absorção do ferro vegetal; chá ~60%) [E].\nVITAMINA D: só ajuda quem está baixo [E]; dosar antes de suplementar; universitário que fica em ambiente fechado é risco [O].\nCÁLCIO: ~1.000 mg/dia [C]; leite, iogurte, queijo.\nSÓDIO NO DIA A DIA: atleta não precisa de sal extra no dia a dia [O/E]; sódio importa nas sessões longas e no calor (ver hidratação).\nFRUTAS E VEGETAIS: 5+ porções/dia; banana é carbo barato [O]."}, {"id": "definicao", "titulo": "Definição / perder gordura sem perder rendimento", "tags": ["definir", "definição", "definicao", "definido", "shape", "físico", "fisico", "secar", "seco", "barriga", "gordura", "perder gordura", "emagrecer", "déficit", "deficit", "cutting", "abdômen", "abdomen", "tanquinho", "recomposição", "bulking"], "texto": "NO APP (Tribunal): déficit de até 300 kcal só qua/qui das S2–S9 e S18–S27; perda máx. 0,3 kg/sem; piso 68,5 kg; sem déficit nas S12–S16 nem nas 8 semanas finais. É conservador de propósito: protege o treino e a saúde.\nO QUE A CIÊNCIA DIZ: déficit de 250–500 kcal/dia por 3–6 semanas, longe das provas [C, ACSM]. Perder ~0,7%/sem preservou e até aumentou massa magra; 1,4%/sem não (Garthe 2011) [E]. No bloco específico do 70.3 (mai–set) não cortar: é quando a baixa disponibilidade de energia aparece [E].\nRECOMPOSIÇÃO: jovem treinado consegue perder gordura e ganhar músculo ao mesmo tempo com força progressiva + proteína alta + energia só levemente negativa (Barakat 2020) [E]. Por isso a força 2x/sem continua no déficit.\nSONO: dormindo 5,5 h vs 8,5 h na mesma dieta, a perda de gordura caiu de 1,4 para 0,6 kg e a de massa magra subiu (Nedeltcheva 2010) [E]. Sono médio <7 h → não aprofundar o déficit.\nNA PRÁTICA (o que mais muda o físico): proteína em todas as refeições, carbo no treino e menos fora dele, menos ultraprocessado/álcool/fritura à noite, consistência semanal. Visual melhora mais devagar que a balança; fotos a cada 4 semanas na mesma luz ajudam [O]."}, {"id": "reds", "titulo": "REDs: comer pouco demais (triagem, não diagnóstico)", "tags": ["reds", "red-s", "red s", "comendo pouco", "comer pouco", "sem fome", "fome", "cansado", "cansaço", "exausto", "libido", "tesão", "ereção", "fratura", "fratura por estresse", "osso", "dor no osso", "rendimento caiu", "piorei", "sem evolução", "platô", "energia baixa"], "texto": "DEFINIÇÃO (COI 2023) [C]: disponibilidade energética (DE) = (comida − gasto do exercício) ÷ massa livre de gordura. Em homens o limiar é menos conhecido e parece mais baixo que nas mulheres; baixa DE pode ser adaptável (curta, leve) ou problemática (prolongada). Baixa disponibilidade de CARBO também pesa.\nSINAIS EM HOMENS [C]: libido baixa, menos ereção matinal, fadiga persistente, platô ou queda de desempenho, FC de repouso muito baixa, sono e humor piores, problemas GI, doenças repetidas, fratura por estresse, peso caindo sem querer.\nREGRAS DA IA: 2+ sinais, ou qualquer dor óssea localizada/fratura por estresse → interromper o déficit na hora e indicar médico/nutricionista humano. A IA não diagnostica: só triagem e encaminhamento. Exames que o médico costuma pedir: testosterona (manhã), T3, ferritina, vitamina D [C].\nCONTA DE SEGURANÇA [O]: com massa livre de gordura estimada em ~60 kg (precisa medir), comida − treino abaixo de ~1.800 kcal por vários dias = alerta."}, {"id": "pre_treino", "titulo": "Pré-treino (o que comer antes)", "tags": ["antes do treino", "pré-treino", "pre-treino", "pre treino", "pré treino", "comer antes", "lanche", "lanche da tarde", "depois da aula", "faculdade", "16h", "hyrox", "20h", "treino cedo", "de manhã", "jejum", "banana", "tapioca"], "texto": "QUANTO [C, ACSM 2016]: sessão >60 min ou intensa → 1–4 g/kg de carbo nas 1–4 h antes (quanto mais longe, mais perto de 4 g/kg); pouca gordura e fibra. 30–60 min antes: carbo pequeno é ok; hipoglicemia de rebote é passageira e não piora o desempenho na maioria [E].\nOPÇÕES BARATAS [O]: pão francês com mel/geleia, tapioca com pouco recheio, banana, arroz branco, cuscuz, aveia.\nROTINA DO ANDRÉ (no app):\n· Treino das 16h depois da aula: se a última refeição foi há >3 h → lanche de 40–70 g de carbo por volta de 14h30–15h (ex.: 2 bananas + pão com mel) [O dentro da faixa C].\n· Hyrox 20h (app): lanche 18h30 com carbo (40–60 g) e pouca gordura; jantar pós às 21h15; sem café depois das 16h.\n· Faltando <1 h sem ter comido: 20–30 g de carbo simples (1 banana ou 1 gel) [O].\n· Treino cedo em jejum: só corrida fácil <45 min. Intervalado, longão >90 min, Hyrox ou simulado → NUNCA em jejum [C/O]."}, {"id": "durante", "titulo": "Durante o treino: carbo por hora, gel, gut training", "tags": ["durante", "gel", "géis", "geis", "carbo por hora", "g/h", "gramas por hora", "longão", "pedal longo", "rapadura", "mel", "isotônico", "isotonico", "treinar o intestino", "gut training", "estômago", "estomago", "enjoo", "náusea", "nausea", "diarreia", "passar mal", "dor de barriga", "barriga ruim"], "texto": "CARBO/H [C/E, Jeukendrup 2014; ACSM 2016]: <45 min → nada · 45–75 min → pouco ou só bochecho · 1–2,5 h → 30–60 g/h · >2,5 h → até ~90 g/h, precisa misturar glicose + frutose (açúcar de mesa já é 1:1; a proporção 2:1 'não é mágica'). No app: treino >75 min → gel a partir de ~40 min (gel <20 g: 1 a cada 30 min).\nFORMA: gel, bebida, jujuba ou comida dão oxidação parecida (Hearris 2022) [E]; sempre beber água junto com gel/sólido. Comida barata (TACO): rapadura ~77–90 g carbo/100 g (varia por marca; cubo de 25 g ≈ 19–22 g), mel ~82 g/100 g, banana ~23–26 g/100 g, paçoca tem gordura (melhor só no início da bike) [O].\nGUT TRAINING [E]: gel a cada 20 min em 1 h de corrida todo dia por 2 semanas cortou ~60% dos sintomas GI (Costa 2017); revisão 2023 confirma menos desconforto. Protocolo do app [O, degraus heurísticos]: 1 treino longo/sem, começa no que tolera (40–50 g/h), sobe ~10 g/h a cada 1–2 semanas se desconforto ≤3/10, alvo 80–90 g/h na bike até jun/jul de 2027, testando o produto da prova e o calor.\nGI: histórico de problema é o maior preditor (Pfeiffer 2012) [E]; fibra, gordura e solução concentrada pioram; nada de anti-inflamatório antes/durante. Náusea → diluir (mais água), reduzir o ritmo 10–15 min [O]."}, {"id": "hidratacao", "titulo": "Hidratação, sódio, calor e isotônico caseiro", "tags": ["água", "agua", "beber", "hidratação", "hidratacao", "suor", "suando", "sódio", "sodio", "sal", "eletrólito", "eletrolito", "isotônico", "isotonico", "gatorade", "calor", "quente", "câimbra", "caimbra", "cãibra", "hiponatremia", "urina", "desidratado"], "texto": "TAXA DE SUOR [C, Baker/GSSI 2017]: (peso antes − peso depois + líquido bebido − urina) ÷ horas. Pesar de sunga, seco, depois de urinar; 1 h parecida com a prova; repetir no calor. Típico 0,5–2,0 L/h.\nQUANTO BEBER: <90 min e clima ameno → pela sede. Prova longa/calor → plano com TETO: beber menos que a taxa de suor e nunca terminar mais pesado do que começou [C, ACSM 2007 + Hew-Butler 2015]. Perder >2% do peso (1,4 kg) atrapalha [C].\nHIPONATREMIA: Ironman NZ 1997: 18% dos finishers com hiponatremia; em 1998, com menos postos e orientação, os casos tratados caíram de 3,8% para 0,6% dos largados (Speedy) [E]. Sinais: tontura, náusea, inchaço, ganho de peso + muita água → parar água pura e procurar a equipe médica [C].\nSÓDIO: suor perde 230–1.610 mg/L [E]; bebida 500–700 mg/L (ACSM 1996) [C]; no plano: 300–600 mg/h, até ~1.000 no calor. Marca branca de sal na roupa ou câimbra no calor → testar 800–1.000 mg/L no treino [O]. Sal não comprovadamente previne câimbra [E].\nCALOR (SP): aclimatar 1–2 semanas com treinos no calor; começar hidratado; pré-hidratar ~5–7 mL/kg (~400–500 mL) ~4 h antes [C, fonte secundária].\nISOTÔNICO CASEIRO (sentença): mar–abr 6% = 1 L de água + 20 g de maltodextrina + 40 g de açúcar + ¼ colher de chá de sal (~1,5 g, ~590 mg sódio) + suco de ½ limão. De maio em diante 8% e depois 9%, só se não houver desconforto GI."}, {"id": "recuperacao", "titulo": "Recuperação: depois do treino, do longão e do Hyrox", "tags": ["depois do treino", "pós-treino", "pos-treino", "pós treino", "pos treino", "recuperação", "recuperacao", "recuperar", "janela", "2 treinos", "dois treinos", "depois do longão", "depois do hyrox", "jantar", "dor muscular", "dolorido"], "texto": "GERAL [C, ISSN 2017]: 20–40 g de proteína + carbo entre logo após e 2 h depois; proteína do dia espalhada a cada ~3–4 h.\n2 TREINOS COM <8 H [C, ACSM 2016]: carbo 1–1,2 g/kg/h nas primeiras 4 h (~70–85 g/h); com pouca fome, 0,8 g/kg/h + 0,2–0,4 g/kg/h de proteína. Ex.: intervalado 16h + força 19h30 → lanche de carbo + proteína logo depois do intervalado.\nDEPOIS DO LONGÃO: primeira refeição com carbo + proteína; repor líquido com sal (até ~150% do peso perdido se houver outro treino em <12 h) [E/O]. Sem 2º treino no dia, refeição normal com sal e água basta [O].\nHYROX 20H (app): jantar 21h15 com carbo + 30–40 g de proteína; ceia proteica (~30–40 g: leite + iogurte, ou queijo/ricota) [E, Res 2012]. Zero cafeína.\nDOR MUSCULAR: nenhuma comida 'milagrosa'; cereja/curcumina têm efeito pequeno e caro [E]; dormir bem e bater proteína e carbo é o que mais ajuda [O]."}, {"id": "cafeina", "titulo": "Cafeína e café", "tags": ["café", "cafe", "cafeína", "cafeina", "energético", "energetico", "red bull", "monster", "pré-treino", "pre-treino", "coca", "coca-cola", "refri", "refrigerante", "sono", "insônia", "dormir"], "texto": "EFEITO: a ajuda ergogênica mais consistente de todas, 3–6 mg/kg (~213–426 mg) ~60 min antes; ~2 mg/kg já pode ajudar; 9 mg/kg só traz efeito colateral [C, ISSN 2021]. Tolerância com uso diário: dados mistos [E].\nNO APP (Tribunal): até 200 mg/dia até a meia, NADA depois das 16h; em longão/prova ~200 mg (2 xícaras de coado) 45–60 min antes; no 70.3 pode somar até 100 mg na corrida. Tudo só se já testado no treino. Hyrox 20h → zero cafeína.\nSONO [E]: cafeína reduz o sono total ~45 min e o sono profundo sem a pessoa perceber (meta-análise 2023); 400 mg até 6 h antes de dormir cortou >1 h de sono (Drake 2013). Um café (~107 mg) só até ~9 h antes de deitar.\nFONTES BR [O]: café coado 200 mL 80–120 mg · Red Bull 250 mL 80 mg · Monster 473 mL ~150–160 mg · Coca 350 mL ~35 mg · gel com cafeína: ver rótulo. Refri zero com cafeína conta no limite e não entra depois das 16h. Pré-treino em pó: não (dose de cada ingrediente oculta, mais cara que café)."}, {"id": "prova", "titulo": "Prova: carbo loading, café da manhã, meia e 70.3", "tags": ["prova", "dia da prova", "véspera", "vespera", "carbo loading", "carb loading", "carregar carbo", "café da manhã da prova", "meia", "meia maratona", "21 km", "70.3", "ironman", "bike da prova", "plano de prova", "semana da prova"], "texto": "CARBO LOADING [C]: para prova >90 min, 8–10 g/kg/dia nas 24–48 h antes (o plano usa 8–10; a literatura vai até 10–12 g/kg por 36–48 h); sem fase de depleção; junto com o polimento. Comer arroz branco, macarrão, pão, tapioca, batata, suco, mel; pouca fibra e gordura no último dia. Peso sobe ~1–2 kg (glicogênio puxa água) → é esperado [O].\nCAFÉ DA MANHÃ DE PROVA [C]: 3–4 h antes, 2–3 g/kg de carbo (~140–210 g): ex. 2–3 pães com mel/geleia + banana + isotônico/água. Só coisa já testada.\nMEIA (~2 h, 07/02/2027) [C/H]: gel opcional 15 min antes; durante 40–60 g/h: 3 géis de 20 g = só ~30 g/h; para 40–60 g/h, 4–5 géis ou gel + isotônico, testados nos longões; líquido pela sede com goles nos postos no calor; cafeína só se testada.\n70.3 [E/O]: natação sem nada; começar a beber/comer nos 10–15 min de bike; BIKE 60–90 g/h glicose+frutose (melhor janela, o estômago tolera mais; dados de campo ~91 g/h); sódio 300–600 mg/h (até ~1.000 no calor), líquido pela taxa de suor medida sem passar dela; CORRIDA 40–60 g/h (gel + isotônico + coca no fim), gelo e esponja; média em 70.3 real 65 ± 25 g/h (Pfeiffer). Chegou à corrida 'cheio' → só água e cola por 15–20 min e retomar. Total estimado ~430 g de carbo [calc].\nNada novo no dia, nada de anti-inflamatório."}, {"id": "suplementos", "titulo": "Suplementos: o que vale e o que não vale", "tags": ["suplemento", "suplementos", "creatina", "whey", "caseína", "beterraba", "nitrato", "beta-alanina", "beta alanina", "bicarbonato", "ômega", "omega", "vitamina d", "ferro", "magnésio", "multivitamínico", "multivitaminico", "bcaa", "glutamina", "pré-treino", "termogênico", "termogenico", "colágeno", "colageno", "probiótico", "probiotico", "cetona", "curcumina", "cereja", "eletrólito", "cápsula de sal"], "texto": "Classificação AIS: A forte · B emergente · C sem benefício · D proibido/alto risco.\n✅ VALE: Creatina monohidratada (A) 3–5 g/dia todo dia, horário livre, sem saturação; ajuda força/Hyrox e surtos; pode subir ~1 kg de água [C/E]. Mitos: rim sem dano nas doses estudadas (avise o médico se fizer exame de creatinina); calvície: 1 estudo de 2009 que nem mediu cabelo [E]. Cafeína (A): ver seção própria. Eletrólitos/sal: no longão e no 70.3 no calor.\n🟡 OPCIONAL: Whey (só se a comida não fecha a meta ou pós-longão). Nitrato/beterraba (A, efeito pequeno em treinado, shot caro no BR; beterraba e folhosos na comida). Probiótico (só se GI recorrente, com profissional). Colágeno 15 g + vit. C 1 h antes de treino de impacto (só se tendinopatia; estudo pequeno) [E].\n🩺 SÓ COM EXAME E MÉDICO: ferro, vitamina D.\n❌ NÃO VALE PARA ELE: beta-alanina e bicarbonato (só esforços de 1–12 min), BCAA, glutamina, multivitamínico (salvo dieta restrita), cetonas (sem efeito), curcumina e cereja (efeito pequeno, caro), magnésio (só se deficiente). Ômega-3: peixe gordo 2x/sem; se não comer, a sentença v2 permite 1–2 g EPA+DHA/dia com laudo de terceiros.\n⛔ RISCO: termogênico e pré-treino 'blend' (estimulantes ocultos; DMAA proibido no BR e ainda apreendido) [C/E]."}, {"id": "marcas", "titulo": "Como escolher marca de suplemento no Brasil", "tags": ["marca", "marcas", "qual marca", "comprar", "creapure", "laudo", "anvisa", "contaminação", "contaminado", "doping", "informed sport", "growth", "max titanium", "integralmedica", "dux", "probiotica", "whey barato", "whey bom"], "texto": "RISCO [E]: 12–58% dos suplementos analisados em estudos tinham substância proibida; em BH (2019) 44,5% das marcas de whey estavam fora da especificação; a ANVISA recolheu lotes de whey em 2025 e houve fármaco não declarado em 2026. Para amador o problema é SAÚDE, não só doping [C].\nREGRAS [O]: sem laudo de lote de laboratório terceiro → não compra · não regularizado na ANVISA → não compra · 'blend' sem dose de cada ingrediente → evita · promete queimar gordura ou 'efeito hormonal' → descarta · preço muito abaixo do mercado → desconfia. Creatina: monohidratada pura; Creapure é matéria-prima rastreável, ajuda mas não substitui o laudo. Selo Informed Sport testa por lote (reduz o risco, não zera) [C]. Nunca recomendar marca específica como 'a melhor'; ensinar a checar."}, {"id": "exames", "titulo": "Exames de sangue úteis", "tags": ["exame", "exames", "exame de sangue", "hemograma", "ferritina", "vitamina d", "b12", "tsh", "testosterona", "creatinina", "médico", "medico", "check-up", "checkup"], "texto": "PAINEL BASE [C/O]: hemograma + ferritina (Clénin 2015); somar saturação de transferrina, 25(OH)D, B12, folato, TSH, creatinina (avisar que toma creatina) e PCR. Ferritina nunca sozinha.\nFERRITINA: muitos serviços de medicina esportiva olham com atenção valores abaixo de ~30–35 µg/L, mesmo quando o laboratório diz 'normal' (a referência começa ~12) [C/O]. Quem interpreta é o médico.\nQUANDO [O]: agora como base, no início do bloco do 70.3 (mar–abr/2027) e sempre que houver sintoma (cansaço persistente, pace piorando sem motivo, FC mais alta no mesmo ritmo).\nINTERAÇÕES [E]: ferro absorve mal com café (~35–40% a menos), chá (~60%), leite e refeição grande; doses ≥60 mg sobem a hepcidina ~24 h (por isso médicos usam dias alternados) — esquema e dose são do médico. Anti-inflamatório (ibuprofeno etc.): não usar antes/durante treino longo ou prova nem de rotina para dor muscular (rim, hiponatremia, menos ganho muscular em dose alta).\nA IA explica o que cada exame mede e quando conversar com o médico; NUNCA diz 'você tem anemia/deficiência' nem dá dose."}, {"id": "alcool", "titulo": "Álcool, festa e fim de semana", "tags": ["álcool", "alcool", "cerveja", "bebida", "beber", "balada", "festa", "rolê", "role", "churrasco", "vinho", "drink", "drinks", "ressaca", "fim de semana", "sábado à noite"], "texto": "EVIDÊNCIA [E]: muito álcool após treino (~12 doses) reduziu a síntese muscular em 24–37% mesmo com proteína (Parr 2014, n=8); o glicogênio só cai quando o álcool SUBSTITUI o carbo (Burke 2003); cerveja reidrata pior e atrapalha reflexo e equilíbrio. Álcool piora o sono, que é onde a recuperação e a definição acontecem.\nREGRAS [O/H]: se for beber → antes come a refeição de recuperação (carbo + proteína) e bebe água/isotônico; 1 copo de água por dose; evitar nas 48 h depois do longão e na semana da prova; nada na véspera de sessão-chave (sábado à noite antes do longão de domingo). Sem sermão: ajudar a encaixar (ex.: festa no sábado → jantar com carbo antes, água entre as doses, longão no fim da manhã)."}, {"id": "erros", "titulo": "Erros comuns do atleta jovem na alimentação", "tags": ["erro", "erros", "dica", "dicas", "o que evitar", "iniciante"], "texto": "1) Comer pouco nos dias de treino (o déficit cresce com o volume) [E]. 2) Priorizar proteína e cortar carbo [E]. 3) Low-carb/cetogênica para secar [E]. 4) Déficit agressivo (>1%/sem) ou no meio do bloco forte [E/C]. 5) Não saber recuperar (só 1,8% de amadores sabiam quanto carbo repor) [E]. 6) Treino duro em jejum [O]. 7) Álcool no lugar da recuperação [C]. 8) Ferro ou vitamina D sem exame [C]. 9) Dormir pouco em fase de definição [E]. 10) Gastar com suplemento antes de acertar arroz, feijão, ovo, frango, sardinha, leite/iogurte, aveia, banana, batata/mandioca [O]. 11) Testar coisa nova no dia da prova [C]. 12) <60 g/h de carbo na bike do 70.3 sem gut training [E/O]. 13) Beber água demais e ganhar peso na prova [E/C]. 14) Anti-inflamatório na prova [E/C]. 15) Cafeína à noite [E]."}, {"id": "foto", "titulo": "Como estimar comida por foto (e dizer a incerteza)", "tags": ["foto", "fotos", "prato", "refeição", "refeicao", "almoço", "almoco", "jantar", "café da manhã", "lanche", "marmita", "pf", "bandejão", "bandejao", "delivery", "ifood", "restaurante", "quantas calorias", "quanto tem", "macros"], "texto": "ERRO REAL [E]: IAs com foto de refeição real erram ~36% em peso/energia (ChatGPT e Claude; Gemini 64–110%) e tendem a SUBESTIMAR, mais em prato grande (PMC 2025). Pessoas olhando fotos erram ~17% em média (1–111%). Melhora quando o usuário diz os ingredientes. Prato simples erra menos que prato misto.\nO QUE ENGANA: óleo/manteiga absorvidos (1 colher de sopa = 70–115 kcal; modelos subestimam 50–130 kcal por prato por causa da gordura de cozimento) · fritura (mandioca 125 → 300 kcal/100 g; batata 52 → 267) · molho, maionese, queijo derretido, requeijão/cream cheese dentro do lanche ou do sushi (hot roll ≈ 2x o Califórnia) · açúcar em bebida, xarope do açaí · corte da carne (contra-filé com gordura 278 vs sem 194 kcal/100 g).\nESCALA NA FOTO [O]: prato raso 24–27 cm (sem referência, assuma 26 cm); garfo ~19–20 cm; lata ~12 cm de altura. Bife do tamanho da palma ≈ 1/6 do prato ≈ 100–130 g. Arroz em 'morro' mais alto que o garfo deitado → 250 g+. Foto de cima esconde a altura → pedir 45° ou perguntar se o prato é fundo. Mão como régua: evidência fraca (Gibson 2016).\nUTENSÍLIOS (TBCA): arroz colher de servir cheia 55 g, escumadeira cheia ~85 g, PF 3–4 colheres (165–220 g) · feijão concha rasa 80 g, cheia 140 g · macarrão escumadeira cheia 110 g, prato raso 280 g · pão francês 50 g · pizza fatia 90 g · sushi peça 30 g · brigadeiro 25 g.\nCOMO RESPONDER: sempre FAIXA, nunca número exato. Largura: prato simples ±15–20% · PF/misto ±25–30% · frito, lanche fechado, molho, delivery ±35–40%. Proteína em faixa de gramas (é o número que mais importa). Suspeita de óleo/fritura → UMA pergunta curta ('frito ou grelhado?'); sem resposta → somar ~1 colher de óleo (~90 kcal) em refogado/restaurante e avisar. Lembrar: 'estimativa de foto serve para ver a tendência da semana, não conta exata'."}, {"id": "tabela_base", "titulo": "Tabela: arroz, feijão, carbos e proteínas (TACO/TBCA)", "tags": ["foto", "fotos", "prato", "refeição", "refeicao", "almoço", "almoco", "jantar", "café da manhã", "lanche", "marmita", "pf", "bandejão", "bandejao", "delivery", "ifood", "restaurante", "quantas calorias", "quanto tem", "macros", "arroz", "feijão", "feijao", "macarrão", "macarrao", "batata", "mandioca", "aipim", "batata-doce", "farofa", "pão", "pao", "tapioca", "cuscuz", "aveia", "granola", "ovo", "ovos", "frango", "carne", "bife", "carne moída", "patinho", "peixe", "tilápia", "atum", "sardinha", "linguiça", "hambúrguer", "whey", "leite", "iogurte", "queijo", "requeijão", "banana", "maçã", "açaí", "acai", "fruta"], "texto": "Formato: porção = kcal | P | C | G (g).\nCARBOS: arroz branco refogado 1 colher de servir 55 g = 75 | 1,3 | 16 | 0,9 (100 g ≈ 128–138 kcal, 28 C) · arroz escumadeira 85 g ≈ 117 | 2 | 25 | 1,4 · feijão carioca hábito", "tags": ["foto", "fotos", "prato", "refeição", "refeicao", "almoço", "almoco", "jantar", "café da manhã", "lanche", "marmita", "pf", "bandejão", "bandejao", "delivery", "ifood", "restaurante", "quantas calorias", "quanto tem", "macros", "exagerei", "exagerei", "comi demais", "jaquei", "enfiei o pé", "furei a dieta", "besteira", "culpa", "rodízio", "rodizio", "festa", "aniversário", "churrasco", "fim de semana", "motivação", "desanimado", "não consigo", "nao consigo"], "texto": "EVIDÊNCIA: entrevista motivacional tem efeito pequeno-moderado justamente na dieta (d≈0,35) [E]; pensamento 'tudo ou nada' está ligado a largar a dieta depois de um deslize [E]; registrar com constância vale mais que registrar com precisão [E]. Guia Alimentar 2014 [C]: preferir comida de verdade a ultraprocessado; comer com regularidade e atenção; pouco óleo, sal e açúcar.\nORDEM DA RESPOSTA: 1) um elogio concreto ('boa, ~45 g de proteína nesse PF') → 2) o número em faixa → 3) NO MÁXIMO uma sugestão, como TROCA, não proibição ('troca a fritas por mais uma concha de feijão: ~150 kcal a menos e mais fibra').\nREGRAS [O]: uma mudança por vez (mesmo foco 1–2 semanas até virar hábito) · avaliar a SEMANA (80/20: ~80% alinhado = ótimo) · festa/rodízio/cerveja: registra sem drama e 'na próxima refeição volta ao normal'; NUNCA propor compensar (jejum, treino extra) · linguagem neutra: nada de 'lixo', 'besteira', 'sujo', 'jacar', 'você deveria'; usar 'dá pra', 'uma opção é' · ligar a comida ao objetivo dele ('isso segura o longão de domingo', 'isso ajuda o físico'), humor leve ok, nunca ironia sobre o corpo · performance antes de estética: pouco carbo em dia de treino forte → mandar comer MAIS · de vez em quando perguntar 'quer dica ou só o registro?' (autonomia)."}, {"id": "baratos", "titulo": "Comida barata e prática para universitário que treina", "tags": ["barato", "barata", "economizar", "dinheiro", "orçamento", "orcamento", "caro", "preço", "preco", "marmita", "marmitas", "levar pra faculdade", "faculdade", "bandejão", "bandejao", "lanche", "prático", "pratico", "rápido", "rapido", "receita", "receitas", "o que cozinhar", "meal prep"], "texto": "CUSTO POR 30 g DE PROTEÍNA [O]: ovo ~4,6 unidades ≈ R$ 4 (dúzia R$ 10,44, Procon-SP fev/2026) · whey concentrado ~37 g ≈ R$ 7 (pote 907 g ~R$ 174) · frango (140 g cru), acém moído (155 g), atum (115 g), sardinha (190 g), leite em pó desnatado (86 g): conferir preço do dia. Arroz + feijão complementa (~12 g por prato), não substitui.\nMARMITAS [O]: frango 120 g + arroz 200 g + feijão + legume ≈ 590 kcal, ~51 g P · carne moída 100 g + mandioca 150 g + 1 ovo ≈ 470 kcal, ~34 g P · macarrão 200 g + 1 lata de atum + molho de tomate ≈ 400 kcal, ~39 g P. Fazer 4–5 de uma vez no domingo.\nPARA A FACULDADE [O]: pão francês + 2 ovos + queijo (~360 kcal, ~22 g P) · banana + paçoca (pré-treino) · iogurte natural + aveia · leite + whey · sanduíche de atum. Pão de queijo só como extra (5 g P/100 g).\nBANDEJÃO/PF [O]: prioriza a proteína do dia, repete o feijão, salada com pouco molho, fruta de sobremesa."}, {"id": "alerta", "titulo": "Sinais de relação ruim com comida: quando parar os números", "tags": ["culpa", "nojo", "odeio meu corpo", "gordo", "gorda", "me sinto gordo", "vomitar", "vomitei", "laxante", "compensar", "queimar o que comi", "não comi nada", "nao comi nada", "pulei refeição", "jejum", "pesar tudo", "medo de comer", "ansiedade", "obsessão", "obsessao", "descontrole", "compulsão", "compulsao"], "texto": "CONTEXTO [C/E]: REDs (COI 2023) inclui homens; SCOFF e EDE-Q são válidos para triagem em atletas. A IA não diagnostica.\nSINAIS: restrição (pular refeições com frequência, comer muito abaixo do treino vários dias, cortar carbo em treino pesado) · culpa ('sou um lixo', 'estraguei tudo', pedir desculpa por comer) · compensação ('vou treinar mais pra queimar', jejum depois de excesso, laxante, vômito) · obsessão (recontar o mesmo prato, ansiedade com 20–50 kcal, pesar tudo, medo de comer fora) · peso/corpo (pesar todo dia com sofrimento, queda não planejada, crítica forte ao corpo) · REDs (fadiga, queda de rendimento, fratura por estresse, libido baixa, doença frequente, humor/sono).\nAÇÃO: 1 sinal isolado → registrar SEM número, validar ('um dia não define nada'), reforçar a regularidade. 2+ sinais em ~2 semanas OU qualquer compensação → PARAR de mostrar kcal e macros; falar só de qualidade e regularidade; sugerir com cuidado nutricionista esportivo ou psicólogo. Vômito, laxante, jejum prolongado, desmaio, fratura por estresse ou perda de peso rápida → indicar profissional de forma clara, sem números de restrição. Risco imediato ou ideia de se machucar → CVV 188 e buscar ajuda urgente. NUNCA: sugerir déficit em dia de treino longo, elogiar 'comer pouco', usar comida como punição.\nCom 2+ sinais ou qualquer compensação: suspender o déficit de qua/qui (volta à manutenção), parar pesagem, fotos de corpo e medida de cintura, e encaminhar."}];
function kbPick(secs, text){
  const q = " "+norm(text)+" ", core = secs.find(x=>x.id==="nucleo");
  const sc = secs.filter(x=>x.id!=="nucleo").map(x=>{ let n = 0; (x.tags||[]).forEach(t=>{ const k = norm(t).trim(); if (!k) return; const re = new RegExp("(^|[^a-z0-9])"+k.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+"(s|es)?(?=[^a-z0-9]|$)"); if (re.test(q)) n += 3; }); return {x, n}; }).filter(o=>o.n).sort((a,b)=>b.n-a.n).slice(0,3).map(o=>o.x);
  return (core?[core]:[]).concat(sc).map(x=>"### "+x.titulo+"\n"+x.texto).join("\n\n");
}

// Ritmos pelo VDOT de Jack Daniels (fórmula de Daniels & Gilbert). Cada zona é uma % do VDOT da pessoa.
// O VDOT vem do melhor tempo do cadastro e se atualiza sozinho com provas e testes registrados (treino marcado "no limite" com km e tempo, ou post de prova).
const vo2De = v => -4.6 + 0.182258*v + 0.000104*v*v;                       // v em m/min
const pctMax = t => 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t);
const vdotDe = (km, min) => (km>0 && min>0) ? vo2De(km*1000/min)/pctMax(min) : 0;
const vAt = o => (-0.182258 + Math.sqrt(0.182258*0.182258 + 4*0.000104*(4.6+o)))/(2*0.000104);
const secKm = o => 60000/vAt(o);
function tempoDe(txt){ const m = /(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(String(txt||"")); if (!m) return 0; return m[3] ? +m[1]*60 + +m[2] + +m[3]/60 : +m[1] + +m[2]/60; }
function marcas(){
  const out = [], p = P && P.perfil || {};
  const s = String(p.melhorTempo||"").replace(",","."); const m = /(\d+(?:\.\d+)?)\s*km\D+(\d{1,3})(?::(\d{2}))?/i.exec(s);
  if (m){ const km = +m[1], mn = +m[2] + (m[3] ? +m[3]/60 : 0); if (km>=3 && mn>8) out.push({d:p.enviadoAt?String(p.enviadoAt).slice(0,10):key(today), km, min:mn, fonte:"seu melhor tempo"}); }
  Object.keys(LOG).forEach(k=>{ const v = LOG[k]; if (!/^ck_/.test(k) || !v || !(v.teste || v.rpe==="limite") || !(+v.km>=3) || !(+v.min>0)) return; const d = k.slice(3,13); const t = treinosDe(parseD(d))[+k.split("_")[2]]; if (t && t.k==="run") out.push({d, km:+v.km, min:+v.min, fonte:"treino no limite"}); });
  (SOC.posts||[]).filter(x=>x.autor===ME() && (x.esporte==="race" || (x.esporte==="run" && (x.stats||[]).some(s2=>/tempo/.test(s2[1]))))).forEach(x=>{ const km = parseFloat(String((x.stats.find(s2=>s2[1]==="km")||[])[0]||"").replace(",",".")); const tm = tempoDe((x.stats.find(s2=>/tempo/.test(s2[1]))||[])[0]); if (km>=3 && tm>0) out.push({d:x.date, km, min:tm, fonte:x.titulo}); });
  const todas = out.map(x=>Object.assign(x, {vdot:vdotDe(x.km, x.min)})).filter(x=>x.vdot>15 && x.vdot<85);
  // o "melhor tempo" do cadastro só conta se nenhuma prova/teste registrado tiver a mesma distância
  return todas.filter(x=>x.fonte!=="seu melhor tempo" || !todas.some(y=>y!==x && Math.abs(y.km-x.km)<0.5));
}
function vdotAtual(){

function zonas(){
  const id = +(P && P.perfil && P.perfil.idade) || 25; const fc = Math.round(208 - 0.7*id);
  const z = {fcMax:fc, z2:[Math.round(fc*0.65), Math.round(fc*0.75)], z1:[Math.round(fc*0.55), Math.round(fc*0.65)]};
  const vm = vdotAtual(); if (!vm) return z;

  return Object.assign(z, {vdot:V, base:vm, p10:true, regen:faixaPct(59,65), leve:faixaPct(65,72), maratona:faixaPct(80,84), limiar:faixaPct(88,92), tiro:faixaPct(97,100), rep:faixaPct(105,110)});

function motivoTreino(t, d){

}
function motivoPlanoMisto(t, d){

  const F = sem.fase, w = s.w, nome = norm(t.t), pl = planoAtual();
  const ant = pl.semanas[w-2], prox = pl.semanas.slice(w).find(x=>x.longao);

    if (t.k==="run") return "Esta semana é de recuperação: você correu 10 km no máximo no domingo, 18/10, e o corpo leva 7 a 10 dias para absorver uma prova. Por isso a corrida maior da semana são 7 km leves, e não um longão. O domingo fica livre para descansar, e o primeiro longão de verdade, de "+kmTxt((prox||{}).longao||8)+" km, vem no domingo seguinte.";
    return "Semana de recuperação depois da prova de 10 km: tudo leve, para voltar a treinar inteiro na semana 2.";
  }
  const desc = sem.deload ? " Semana de descarga: volume menor para o corpo absorver as semanas anteriores e voltar mais forte." : "";
  if (t.k==="run"){
    if (/meia maratona|70\.3/.test(nome)) return "Dia de prova. Tudo nas semanas anteriores foi para chegar aqui.";
    if (/longao/.test(nome)){ const a = ant && ant.longao; return "Longão de "+kmTxt(t.km)+" km"+(a?" (semana passada: "+kmTxt(a)+" km)":"")+". É o treino que mais constrói resistência para a meia de fevereiro e para os 21 km do 70.3. Sobe no máximo 10% por vez para não machucar."+desc; }
    if (/regenerativo/.test(nome)) return "Dia depois do Hyrox: corrida bem leve para soltar a perna e somar km sem cansar. Assim você chega inteiro no treino forte de sexta."+desc;
    if (/intervalado/.test(nome)) return "O treino forte de corrida da semana: deixa seu pace mais rápido (VO2 máximo). Fica a 2 dias do longão para você chegar descansado nele."+desc;
    if (/limiar/.test(nome)) return "Treino de ritmo: aumenta o quanto você aguenta correr forte por muito tempo. É o pace que mais pesa na meia maratona."+desc;
    return "Corrida leve para somar volume sem cansar: é a base que deixa os treinos fortes e o longão possíveis."+desc;
  }
  if (t.k==="bike") return (/sweet/.test(nome) ? "Treino forte de bike: no 70.3 são 90 km de pedal, e o sweet spot é o que mais melhora sua potência por hora de treino." : /corrida|transi/.test(nome+" "+(t.passos||[]).join(" ")) ? "Bike + corrida logo em seguida (transição): ensina a perna a correr cansada, do jeito que vai ser na prova." : "Bike em zona 2: constrói base aeróbica sem impacto na perna. No 70.3 a bike é a parte mais longa (90 km).")+desc;
  if (t.k==="swim") return (/css/.test(nome) ? "Natação no seu ritmo de limiar: melhora a velocidade que você sustenta nos 1,9 km da prova." : "Natação contínua e leve: técnica e resistência para nadar 1,9 km sem parar.")+desc;
  if (/hyrox/.test(nome)) return "Força com resistência: deixa as pernas e o core fortes para segurar a postura no fim da prova. É um dos 2 dias duros da semana."+desc;
  if (t.k==="gym") return "Força previne lesão e deixa a passada mais econômica: com a perna mais forte, o mesmo pace gasta menos energia."+desc;
  return "";
}

  const kg = +(P && P.perfil && P.perfil.peso) || 70, mn = +(c && c.min) || +t.min || 0;
  if (t.k==="run"){ const km = +(c && c.km) || +t.km || 0; return Math.round(km ? kg*km*1.0 : MET.run*kg*mn/60); }
  if (t.k==="swim"){ const m = +(c && c.m) || +t.m || 0; return Math.round(MET.swim*kg*((mn || m/33)/60)); }

function gastoDia(d){

  try{
    const r = await comTempo(sample.json(pedido, {cache:false}), 40000);
    const v = {txt, resposta:String(r.resposta||"").slice(0,500), at:new Date().toISOString()};
    const n = r.mudar && r.novo && r.novo.t ? r.novo : null;

function telaCodigo(){
  const app = tela('<span class="wm"><i></i>'+esc(BRAND)+'</span><h1 class="h1">Seu código de convite</h1><p class="s">O app está em teste fechado. Digite o código que veio com o convite do seu amigo, ou o de um Personal ou Nutri.</p>'+

    '<button class="btn go" type="button" id="cdok">Entrar</button><p class="msg" id="cdm"></p><p class="s">Não tem? Peça para quem te mandou o link.</p>');

  const entrar = async ()=>{
    const v = $("cd").value.trim().toUpperCase();

      const r = normalizarCodigo(v) ? await lerConvite(v) : {erro:"codigo"};   // só valida: quem consome o convite é Pro.aceitarConvite

      try{ localStorage.setItem("tropa-conv-pend", r.n); }catch(e){}
      try{ await db.collection("acessos").doc(me).set(ACESSO); }catch(e){}
      try{ localStorage.setItem("ar2-acesso-"+me, JSON.stringify(ACESSO)); }catch(e){}
      rotear(true); return;
    }
    ACESSO = {status:"aceito", via:"codigo", codigo:v, indicadoPor: v===b ? "dono" : v.slice(b.length+1), at:new Date().toISOString()};
    try{ await db.collection("acessos").doc(me).set(ACESSO); }catch(e){}
    try{ localStorage.setItem("ar2-acesso-"+me, JSON.stringify(ACESSO)); }catch(e){}
    rotear(true);
  };

}

  if (suspenso()) return "Hoje é zero treino. Pelo seu check-in, o corpo pediu parada: descanse e, se a dor ou o sintoma continuar, procure um médico.";
  if (s && s.w<1) return "Seu plano começa "+fmt(inicioPlano(today))+". Até lá: sono em dia e uma caminhada leve.";
  const ontem = key(addDays(today,-1)), nfOntem = Object.keys(LOG).filter(x=>x.startsWith("nf_"+ontem)).map(x=>LOG[x]);
  if (nfOntem.some(n=>/Dor|Doente/.test(n.motivo))) return "Ontem você parou por "+nfOntem[0].motivo.toLowerCase()+". Hoje vá com calma: se ainda incomodar, faça a versão leve ou descanse e me conte no chat.";

  if (!ts.length) return "Descanso também é treino. Durma bem, coma bem e bebe água: é hoje que o corpo fica mais forte.";
  if (pr!=null && pr<50) return "Prontidão baixa hoje ("+pr+"). Faça a versão leve do treino ou troque por mobilidade. Amanhã a gente compensa no descanso.";
  if (s && s.sem && s.sem.deload) return "Semana leve: menos volume para o corpo absorver o treino. Não tente compensar.";

function aplicarTeto(){
  if (!P || !P.perfil || !planoAtual() || pausaAtiva()) return;

    const ini = addDays(seg0, 7*n), wk = key(ini);

    const perfilMin = (+P.perfil.kmSemana||0)*7;

    const ct = calcularTeto(feitas, perfilMin, lim); if (!ct) return;
    const dias = [];

      dias.push({id:k, min:ts.reduce((s,t)=>s+minutosPlan(t),0), prio:ts.length?Math.max(...ts.map(prioridadeTreino)):0,
        fixo: d < today || ts.some((t,j)=>feito(d,j)) || !!LOG["aj_"+k]});

    if (!r.cortes.length) return;

  });
}

function sugestaoSemana(){

  const seg0 = addDays(today, -dow(today)), next = addDays(seg0, 7), nk = key(next);

  if (res.tipo !== "aliviar" || LOG["fb_"+nk]) return null;
  const dias = [];
  for (let i=0;i<7;i++){
    const d = addDays(next,i), k = key(d), ts = treinosDe(d);
    dias.push({id:k, min:ts.reduce((s,t)=>s+minutosPlan(t),0), prio:ts.length?Math.max(...ts.map(prioridadeTreino)):0, fixo: d < today || ts.some((t,j)=>feito(d,j)) || !!LOG["aj_"+k]});

async function lerArquivoTreino(file){
  const MAX = 10*1024*1024;
  if (file.size > 25*1024*1024) throw new Error("Arquivo grande demais.");
  let buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0]===0x1f && buf[1]===0x8b){
    if (typeof DecompressionStream === "undefined") throw new Error("Seu navegador não abre .gz. Descompacte o arquivo antes.");
    const rd = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip")).getReader(), partes = []; let tot = 0;
    for (;;){ const {done, value} = await rd.read(); if (done) break; tot += value.length; if (tot > MAX){ rd.cancel(); throw new Error("Arquivo grande demais (mais de 10 MB descompactado)."); } partes.push(value); }
    buf = new Uint8Array(tot); let o = 0; partes.forEach(p=>{ buf.set(p, o); o += p.length; });
  }
  if (!buf.length) throw new Error("O arquivo está vazio.");
  if (buf.length > MAX) throw new Error("Arquivo grande demais (mais de 10 MB).");
  if (buf.length >= 12 && String.fromCharCode(buf[8], buf[9], buf[10], buf[11]) === ".FIT") return lerFIT(buf);
  const txt = new TextDecoder("utf-8").decode(buf);
  if (/<gpx[\s>]/i.test(txt)) return lerGPX(txt);
  if (/<TrainingCenterDatabase/.test(txt)) return lerTCX(txt);
  throw new Error("Não reconheci o formato. Use GPX, TCX ou FIT.");
}

function carregarPostsDono(src){
  if (!src || !src.collection || isOwner) return;
  try{ src.collection("posts").onSnapshot(snap=>{
    const real = snap.docs.map(d=>Object.assign({id:d.id}, d.data()||{})).filter(p=>p.publicar);
    SOC.posts = SOC.posts.filter(p=>p.autor!=="andre");
    real.forEach(p=>SOC.posts.push({id:"a"+p.id, autor:"andre", date:p.date||p.id, at:p.at||((p.date||p.id)+"T12:00:00"), esporte:p.esporte||"run", titulo:p.titulo||"Treino", stats:Array.isArray(p.stats)?p.stats:[], legenda:p.legenda||"", foto:p.foto||((p.fotos||[])[0]?"/_blob/"+encodeURIComponent(p.fotos[0]):""), selo:p.selo||""}));
    if (R.tab==="feed" && !R.sub) render(true);
  }, ()=>{}); }catch(e){}
}

    it.push({cor:nf?"#9AA3AD":CORK[t.k], sig:SIGK[t.k], t:t.t, ok:!!c, nf, det: c ? [c.km?num(c.km,1)+" km":"", c.m?c.m+" m":"", c.min?c.min+" min":"", c.rpe?"esforço "+c.rpe:"", c.vol?c.vol.toLocaleString("pt-BR")+" kg":"", c.prs?c.prs+" recorde(s)":""].filter(Boolean).join(" · ") : nf ? "não fez · "+nf.motivo+(nf.txt?" · "+nf.txt:"") : (d<today?"não marcado":"planejado"), foto:LOG["ft_"+k+"_"+i]||""}); });

/* ---- números ---- */
function horasSemana(ini){
  const h = {run:0, swim:0, bike:0, gym:0};
  for (let i=0;i<7;i++){ const d = addDays(ini,i), k = key(d); treinosDe(d).forEach((t,j)=>{ const c = feito(d,j); if (c) h[t.k] = (h[t.k]||0) + minDe(c,t)/60; }); postsDoDia(k).filter(p=>p.esporte==="race").forEach(p=>{ const tm = tempoDe((p.stats.find(s=>/tempo/.test(s[1]))||[])[0]); h.run += (tm||60)/60; }); }
  return h;
}

function graficoVolume(){

  const tot = sem.map(s=>ks.reduce((a,k)=>a+s.h[k],0)), mx = Math.max(2, Math.ceil(Math.max(...tot)));
  const passo = mx<=4?1:mx<=10?2:5, bw=(W-P.l-P.r)/N-8, y=v=>P.t+(H-P.t-P.b)*(1-v/mx);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Horas de treino por semana, por modalidade">';
  for (let v=0; v<=mx; v+=passo) s+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="currentColor" stroke-opacity=".12"/><text x="'+(P.l-4)+'" y="'+(y(v)+3)+'" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".65">'+v+'h</text>';
  sem.forEach((w,i)=>{ const x=P.l+4+i*(bw+8); let acc=0; ks.forEach((k,j)=>{ const v=w.h[k]; if (v<0.05) return; const y0=y(acc+v), hh=y(acc)-y(acc+v)-2; s+='<rect x="'+x+'" y="'+y0+'" width="'+bw+'" height="'+Math.max(2,hh)+'" rx="3" fill="'+cores[j]+'"><title>'+w.lb+' · '+["corrida","natação","bike","força/hyrox"][j]+': '+num(v,1)+' h</title></rect>'; acc+=v; }); s+='<text x="'+(x+bw/2)+'" y="'+(H-7)+'" font-size="8.5" text-anchor="middle" fill="currentColor" fill-opacity=".65">'+w.lb+'</text>'; });

}
function graficoVdot(){

function intensidade(){

/* ---- missões da semana (bônus de 150 XP ao completar as 3) ---- */
function iniSemana(d){ return addDays(d || today, -dow(d || today)); }
function missoesSemana(ini){
  ini = ini || iniSemana(); let plan = 0, feitos = 0, janelas = 0, fechou = 0;
  for (let i=0;i<7;i++){ const d = addDays(ini,i), k = key(d); if (d>today) break;
    treinosDe(d).forEach((t,j)=>{ if (justificado(d,j)) return; plan++; if (feito(d,j)) feitos++; });
    if (LOG["tj_"+k]) janelas++; if (LOG["co_"+k]) fechou++; }
  const alvoT = Math.max(1, Math.ceil(plan*0.8));
  const ms = [{t:"Fazer pelo menos 80% dos treinos do plano", v:feitos, a:plan ? alvoT : 1, extra: plan ? feitos+" de "+plan+" treinos" : "sem treino planejado esta semana"},
    {t:"Registrar a Janela da Tropa em 4 dias", v:janelas, a:4, extra:janelas+" de 4"},
    {t:"Fechar o dia 5 vezes", v:fechou, a:5, extra:fechou+" de 5"}];
  if (!plan) ms[0].v = ms[0].a;   // semana sem treino planejado não trava a missão
  ms.forEach(m=>{ m.ok = m.v>=m.a; });
  const todas = ms.every(m=>m.ok), resgatada = !!LOG["mw_"+key(ini)];
  return {ms, todas, resgatada, ini};
}

function maiorCorridaFeita(){ const p = P.perfil||{}; return Math.max(maiorFeito("run","km"), +p.maiorLongao||0); }

    const novo = Math.min(alvo, Math.max(s.longao||0, Math.round(cur*1.1*2)/2)); if (novo>cur) cur = novo; passos.push({w, data:domingo(w), km:cur, trava:false});

  return {atual, wAlvo, viavel: wAlvo>0 && ate1Max>=alvo, alcance: Math.round(ate1Max*2)/2, maisCedo, passos: ate1, planoAtual: s0?s0.w:0, semDisp, margem};
}
function duracaoLeve(km){ const Z = zonas(); if (!Z.leve) return ""; const sec = (Z.leve[0]+Z.leve[1])/2*km, h = Math.floor(sec/3600), m = Math.round((sec%3600)/60/5)*5; return h+"h"+String(m===60?0:m).padStart(2,"0")+(m===60?"+":""); }

function propostaKm(r, alvo){ if (!r) return []; const pl = planoAtual(); return r.passos.filter(x=>!x.trava).map(x=>{ const s = pl.semanas[x.w-1], lg = s.dias[6].treinos.find(t=>/longão/i.test(t.t)); return lg && x.km>(+lg.km||0) ? {w:x.w, data:key(x.data), de:+lg.km||0, para:Math.min(alvo, x.km)} : null; }).filter(Boolean); }

async function enviarChat(){

  if (!sample){ L.push({role:"user",content:q},{role:"assistant",content:"O assistente não está disponível agora. Abra o app dentro do Claude (app ou claude.ai)."}); telaChat(); return; }
  L.push({role:"user", content:q}); L.push({role:"assistant", content:"…"}); telaChat();
  const turns = [{role:"user", content:"CONTEXTO (não responda a isto, só use):\n"+contexto(q)}, {role:"assistant", content:"Beleza."}].concat(L.filter(m=>!m.sys).slice(-9,-1).map(m=>({role:m.role, content:m.content})));
  try{
    mudancas = [];
    const opts = {cache:false, onText:({text})=>{ L[L.length-1].content = text; const ms = document.querySelectorAll("#msgs .m"); if (ms.length) ms[ms.length-1].textContent = text; }};
    opts.tools = ferramentas();
    let r;
    try{ r = await sample(turns, opts); }
    catch(e1){ if (opts.tools && !mudancas.length && !(e1 && e1.text)){ delete opts.tools; r = await sample(turns, opts); } else throw e1; }
    L[L.length-1].content = r.text;
    if (mudancas.length){ L.push({role:"assistant", sys:true, content:(chatModo==="coach"?"Calendário atualizado: ":"Salvo no seu dia: ")+mudancas.join(" · ")}); }
  }catch(e){ registrarErro("chat", e); L[L.length-1].content = e && e.code==="rate_limited" ? "Você atingiu o limite de mensagens por agora. Volte em algumas horas: seu plano continua aqui." : "Deu um erro. Tente de novo."; }
  telaChat();
}

async function lerConvite(cod){   // só lê e valida; não consome
  const n = normalizarCodigo(cod); if (!n) return {erro:"codigo"};
  try{
    const s = await realDb.collection("convites").doc(n).get(); if (!s.exists) return {erro:"codigo"};
    const c = s.data()||{};
    if (!PAPEIS_PRO.includes(c.papel)) return {erro:"codigo"};
    if (c.usado) return {erro:"usado"};
    if (!conviteValido(c, Date.now())) return {erro: Number.isFinite(c.expira) ? "expirado" : "codigo"};
    if (c.profId===me) return {erro:"proprio"};
    const p = await realDb.collection("papeis").doc(c.profId).get(), pp = p.exists ? (p.data()||{}) : {};
    if (!jwkPubOk(pp.pub) || !pp[c.papel]) return {erro:"profissional"};
    return {n, c, nome: String(pp.nome||"").slice(0, 40) || "Seu "+NOMEMODO[c.papel]};
  }catch(e){ return {erro:"falha"}; }
}
